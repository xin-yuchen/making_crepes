function drawCustomer(g, c, x, y, r, expr, t, opts = {}) {
  g.save(); g.translate(x, y);
  g.translate(0, Math.sin(t * 2.1) * r * 0.025);
  g.lineJoin = 'round'; g.lineCap = 'round';
  const lw = Math.max(1.5, r * 0.055);
  /* back hair */
  if (c.id === 'kid') {
    [-1, 1].forEach(d => {
      g.save(); g.translate(d * r * 1.02, r * 0.28); g.rotate(d * 0.35 + Math.sin(t * 2.4 + d) * 0.06);
      ellipse(g, 0, r * 0.32, r * 0.24, r * 0.42); g.fillStyle = c.hair; g.fill(); g.strokeStyle = INK; g.lineWidth = lw; g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.18)'; ellipse(g, -r * 0.06, r * 0.22, r * 0.06, r * 0.22); g.fill();
      circle(g, 0, -r * 0.08, r * 0.11); g.fillStyle = '#e8413b'; g.fill(); g.stroke();
      g.restore();
    });
  }
  if (c.id === 'grandma') {
    g.fillStyle = '#b4abc2';
    for (let i = 0; i < 9; i++) { const a = Math.PI * 0.95 + i * (Math.PI * 1.1 / 8); circle(g, Math.cos(a) * r * 0.92, Math.sin(a) * r * 0.85 + r * 0.05, r * 0.3); g.fill(); }
  }
  /* body */
  g.beginPath();
  g.moveTo(-r * 1.32, r * 2.15);
  g.bezierCurveTo(-r * 1.3, r * 1.4, -r * 0.95, r * 1.05, -r * 0.42, r * 0.95);
  g.lineTo(r * 0.42, r * 0.95);
  g.bezierCurveTo(r * 0.95, r * 1.05, r * 1.3, r * 1.4, r * 1.32, r * 2.15);
  g.closePath();
  const sg = g.createLinearGradient(-r, r, r, r * 2.1);
  sg.addColorStop(0, c.shirt); sg.addColorStop(1, c.shirtDark);
  g.fillStyle = sg; g.fill(); g.strokeStyle = INK; g.lineWidth = lw; g.stroke();
  g.save(); g.clip();
  if (c.id === 'grandma') {
    const Rf = mulberry32(5);
    for (let i = 0; i < 16; i++) {
      const fx = (Rf() - 0.5) * r * 2.6, fy = r * (1.05 + Rf() * 1.1), fr = r * 0.09;
      g.fillStyle = i % 3 ? '#ffe9e0' : '#ffd25a';
      for (let k = 0; k < 5; k++) { const a = k / 5 * TAU; circle(g, fx + Math.cos(a) * fr, fy + Math.sin(a) * fr, fr * 0.7); g.fill(); }
      g.fillStyle = '#f2a12b'; circle(g, fx, fy, fr * 0.5); g.fill();
    }
  }
  if (c.id === 'office') {
    g.strokeStyle = '#c23b34'; g.lineWidth = r * 0.07;
    g.beginPath(); g.moveTo(-r * 0.45, r * 0.98); g.lineTo(-r * 0.15, r * 1.75); g.moveTo(r * 0.45, r * 0.98); g.lineTo(r * 0.15, r * 1.75); g.stroke();
    rrect(g, -r * 0.24, r * 1.7, r * 0.48, r * 0.36, r * 0.05); g.fillStyle = '#ffffff'; g.fill(); g.strokeStyle = INK; g.lineWidth = lw * 0.6; g.stroke();
    g.fillStyle = '#2d6fb7'; g.fillRect(-r * 0.2, r * 1.74, r * 0.4, r * 0.08);
  }
  g.restore();
  if (c.id === 'student' || c.id === 'office') {
    g.fillStyle = '#ffffff'; g.strokeStyle = INK; g.lineWidth = lw * 0.8;
    g.beginPath(); g.moveTo(-r * 0.42, r * 0.93); g.lineTo(-r * 0.06, r * 1.28); g.lineTo(-r * 0.2, r * 0.9); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(r * 0.42, r * 0.93); g.lineTo(r * 0.06, r * 1.28); g.lineTo(r * 0.2, r * 0.9); g.closePath(); g.fill(); g.stroke();
  }
  if (c.id === 'office') {
    g.beginPath(); g.moveTo(-r * 0.08, r * 1.08); g.lineTo(r * 0.08, r * 1.08); g.lineTo(r * 0.13, r * 1.75); g.lineTo(0, r * 1.92); g.lineTo(-r * 0.13, r * 1.75); g.closePath();
    g.fillStyle = '#2d3b66'; g.fill(); g.strokeStyle = INK; g.lineWidth = lw * 0.8; g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = r * 0.03;
    for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(-r * 0.09, r * (1.25 + i * 0.18)); g.lineTo(r * 0.1, r * (1.18 + i * 0.18)); g.stroke(); }
  }
  if (c.id === 'student') {
    g.fillStyle = '#2b5fae';
    g.font = `${Math.max(7, r * 0.2)}px "Huninn", "PingFang TC", "Noto Sans TC", sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('林阿翔', r * 0.68, r * 1.42);
    g.font = `${Math.max(6, r * 0.15)}px "Lilita One", sans-serif`;
    g.fillText('110423', r * 0.68, r * 1.63);
  }
  if (c.id === 'kid') {
    g.fillStyle = '#ffffff'; g.strokeStyle = INK; g.lineWidth = lw * 0.8;
    ellipse(g, -r * 0.3, r * 1.0, r * 0.34, r * 0.16, 0.25); g.fill(); g.stroke();
    ellipse(g, r * 0.3, r * 1.0, r * 0.34, r * 0.16, -0.25); g.fill(); g.stroke();
    circle(g, r * 0.62, r * 1.5, r * 0.16); g.fillStyle = '#fff'; g.fill(); g.strokeStyle = '#e8413b'; g.lineWidth = lw * 0.9; g.stroke();
    g.fillStyle = '#e8413b'; circle(g, r * 0.62, r * 1.5, r * 0.05); g.fill();
  }
  /* neck */
  g.fillStyle = c.skinDark; rrect(g, -r * 0.22, r * 0.72, r * 0.44, r * 0.32, r * 0.1); g.fill();
  /* ears */
  [-1, 1].forEach(d => { circle(g, d * r * 0.97, r * 0.12, r * 0.17); g.fillStyle = c.skin; g.fill(); g.strokeStyle = INK; g.lineWidth = lw; g.stroke(); });
  /* head */
  circle(g, 0, 0, r);
  const hg = g.createRadialGradient(-r * 0.32, -r * 0.38, r * 0.1, 0, 0, r * 1.05);
  hg.addColorStop(0, '#fff1e4'); hg.addColorStop(0.5, c.skin); hg.addColorStop(1, c.skinDark);
  g.fillStyle = hg; g.fill(); g.strokeStyle = INK; g.lineWidth = lw; g.stroke();
  drawFace(g, c, r, expr, t, lw);
  drawHairFront(g, c, r, lw);
  if (c.id === 'grandma' || c.id === 'office') {
    g.strokeStyle = c.id === 'grandma' ? '#8b5a36' : '#22201f'; g.lineWidth = lw * 0.85;
    const ey = r * 0.1;
    if (c.id === 'grandma') { circle(g, -r * 0.36, ey, r * 0.21); g.stroke(); circle(g, r * 0.36, ey, r * 0.21); g.stroke(); }
    else { rrect(g, -r * 0.6, ey - r * 0.15, r * 0.42, r * 0.3, r * 0.08); g.stroke(); rrect(g, r * 0.18, ey - r * 0.15, r * 0.42, r * 0.3, r * 0.08); g.stroke(); }
    g.beginPath(); g.moveTo(-r * 0.16, ey - r * 0.02); g.quadraticCurveTo(0, ey - r * 0.08, r * 0.16, ey - r * 0.02); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.35)'; ellipse(g, -r * 0.42, ey - r * 0.06, r * 0.06, r * 0.03, -0.5); g.fill(); ellipse(g, r * 0.3, ey - r * 0.06, r * 0.06, r * 0.03, -0.5); g.fill();
  }
  if (opts.splat) {
    g.fillStyle = '#f3e1ad'; g.strokeStyle = 'rgba(150,120,60,0.6)'; g.lineWidth = 1;
    const sx = r * 0.45, sy = -r * 0.35;
    g.save(); g.translate(sx, sy); blobPath(g, r * 0.17, mulberry32(3), 9, 0.5); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.6)'; circle(g, -r * 0.04, -r * 0.05, r * 0.04); g.fill(); g.restore();
  }
  g.restore();
}

function drawHairFront(g, c, r, lw) {
  g.strokeStyle = INK; g.lineWidth = lw;
  if (c.id === 'student') {
    g.beginPath();
    g.moveTo(-r * 1.0, r * 0.05);
    g.bezierCurveTo(-r * 1.15, -r * 0.9, r * 1.15, -r * 0.95, r * 1.0, r * 0.05);
    g.lineTo(r * 0.82, -r * 0.18);
    const spikes = [[0.62, -0.32], [0.45, -0.2], [0.25, -0.36], [0.02, -0.24], [-0.2, -0.38], [-0.42, -0.22], [-0.62, -0.34], [-0.82, -0.16]];
    spikes.forEach(([sx, sy]) => g.lineTo(r * sx, r * sy));
    g.closePath();
    g.fillStyle = c.hair; g.fill(); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = r * 0.06;
    g.beginPath(); g.arc(-r * 0.1, -r * 0.05, r * 0.75, Math.PI * 1.2, Math.PI * 1.45); g.stroke();
  } else if (c.id === 'grandma') {
    g.fillStyle = c.hair;
    for (let i = 0; i < 9; i++) {
      const a = Math.PI * 1.05 + i * (Math.PI * 0.9 / 8);
      circle(g, Math.cos(a) * r * 0.78, Math.sin(a) * r * 0.72 - r * 0.05, r * 0.27); g.fill(); g.stroke();
    }
    circle(g, 0, -r * 0.62, r * 0.42); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i = 0; i < 6; i++) { const a = Math.PI * 1.1 + i * 0.16; circle(g, Math.cos(a) * r * 0.75 - r * 0.05, Math.sin(a) * r * 0.7 - r * 0.1, r * 0.06); g.fill(); }
  } else if (c.id === 'office') {
    g.beginPath();
    g.moveTo(-r * 1.0, r * 0.1);
    g.bezierCurveTo(-r * 1.1, -r * 1.0, r * 1.1, -r * 1.0, r * 1.0, r * 0.1);
    g.bezierCurveTo(r * 0.9, -r * 0.3, r * 0.4, -r * 0.5, -r * 0.25, -r * 0.42);
    g.bezierCurveTo(-r * 0.55, -r * 0.35, -r * 0.85, -r * 0.2, -r * 1.0, r * 0.1);
    g.closePath(); g.fillStyle = c.hair; g.fill(); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = r * 0.03;
    g.beginPath(); g.moveTo(-r * 0.3, -r * 0.9); g.quadraticCurveTo(-r * 0.32, -r * 0.65, -r * 0.25, -r * 0.43); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.22)'; g.lineWidth = r * 0.06;
    g.beginPath(); g.arc(r * 0.1, -r * 0.1, r * 0.72, Math.PI * 1.25, Math.PI * 1.55); g.stroke();
  } else if (c.id === 'kid') {
    g.beginPath();
    g.moveTo(-r * 1.0, r * 0.15);
    g.bezierCurveTo(-r * 1.12, -r * 0.95, r * 1.12, -r * 0.95, r * 1.0, r * 0.15);
    g.lineTo(r * 0.78, -r * 0.3);
    g.quadraticCurveTo(0, -r * 0.18, -r * 0.78, -r * 0.3);
    g.closePath(); g.fillStyle = c.hair; g.fill(); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = r * 0.03;
    for (let i = -3; i <= 3; i++) { g.beginPath(); g.moveTo(i * r * 0.2, -r * 0.24 - Math.abs(i) * r * 0.02); g.lineTo(i * r * 0.22, -r * 0.5); g.stroke(); }
    g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = r * 0.06;
    g.beginPath(); g.arc(0, -r * 0.1, r * 0.78, Math.PI * 1.2, Math.PI * 1.45); g.stroke();
  }
}

function drawFace(g, c, r, expr, t, lw) {
  const ex = r * 0.36, ey = r * 0.1;
  const blink = expr !== 'happy' && expr !== 'love' && (t % 3.7) < 0.12;
  g.fillStyle = '#2a1a12'; g.strokeStyle = '#2a1a12';
  const brows = (inner, outer) => {
    g.lineWidth = r * 0.055;
    [-1, 1].forEach(d => { g.beginPath(); g.moveTo(d * ex - d * r * 0.12, ey - r * outer); g.lineTo(d * ex + d * r * 0.1 - d * r * 0.2, ey - r * inner); g.stroke(); });
  };
  const dotEyes = (sx = 1, sy = 1) => {
    [-1, 1].forEach(d => {
      ellipse(g, d * ex, ey, r * 0.085 * sx, r * 0.115 * sy); g.fillStyle = '#2a1a12'; g.fill();
      g.fillStyle = '#ffffff'; circle(g, d * ex - r * 0.025, ey - r * 0.045, r * 0.035 * sx); g.fill();
    });
  };
  g.lineWidth = r * 0.06;
  switch (expr) {
    case 'happy':
      [-1, 1].forEach(d => { g.beginPath(); g.arc(d * ex, ey + r * 0.05, r * 0.1, Math.PI * 1.15, Math.PI * 1.85); g.stroke(); });
      break;
    case 'love':
      [-1, 1].forEach(d => {
        ellipse(g, d * ex, ey, r * 0.11, r * 0.14); g.fillStyle = '#2a1a12'; g.fill();
        g.fillStyle = '#fff'; circle(g, d * ex - r * 0.035, ey - r * 0.05, r * 0.045); g.fill(); circle(g, d * ex + r * 0.04, ey + r * 0.05, r * 0.022); g.fill();
        g.save(); g.translate(d * ex + r * 0.02, ey - r * 0.01);
        g.fillStyle = '#ffd75a'; g.beginPath();
        for (let k = 0; k < 8; k++) { const a = k / 8 * TAU, rad = k % 2 ? r * 0.02 : r * 0.055; k ? g.lineTo(Math.cos(a) * rad, Math.sin(a) * rad) : g.moveTo(Math.cos(a) * rad, Math.sin(a) * rad); }
        g.closePath(); g.fill(); g.restore();
      });
      break;
    case 'shock':
      [-1, 1].forEach(d => { circle(g, d * ex, ey, r * 0.13); g.fillStyle = '#fff'; g.fill(); g.lineWidth = lw * 0.8; g.stroke(); g.fillStyle = '#2a1a12'; circle(g, d * ex, ey + r * 0.01, r * 0.045); g.fill(); });
      brows(0.32, 0.25);
      break;
    case 'worry':
      blink ? [-1, 1].forEach(d => { g.beginPath(); g.moveTo(d * ex - r * 0.08, ey); g.lineTo(d * ex + r * 0.08, ey); g.stroke(); }) : dotEyes(0.95, 0.9);
      g.strokeStyle = '#2a1a12'; brows(0.3, 0.2);
      break;
    case 'sad':
      g.lineWidth = r * 0.06;
      [-1, 1].forEach(d => { g.beginPath(); g.moveTo(d * ex - d * r * 0.11, ey - r * 0.04); g.lineTo(d * ex + d * r * 0.03, ey + r * 0.03); g.lineTo(d * ex - d * r * 0.11, ey + r * 0.09); g.stroke(); });
      g.strokeStyle = 'rgba(90,120,220,0.45)'; g.lineWidth = r * 0.035;
      for (let i = -2; i <= 2; i++) { g.beginPath(); g.moveTo(i * r * 0.15, -r * 0.62); g.lineTo(i * r * 0.15, -r * 0.3); g.stroke(); }
      break;
    default:
      if (blink) { [-1, 1].forEach(d => { g.beginPath(); g.moveTo(d * ex - r * 0.08, ey + r * 0.02); g.quadraticCurveTo(d * ex, ey + r * 0.06, d * ex + r * 0.08, ey + r * 0.02); g.stroke(); }); }
      else dotEyes();
  }
  if (c.id === 'office' && expr !== 'love') {
    g.strokeStyle = 'rgba(140,100,160,0.4)'; g.lineWidth = r * 0.03;
    [-1, 1].forEach(d => { g.beginPath(); g.arc(d * ex, ey + r * 0.1, r * 0.09, Math.PI * 0.2, Math.PI * 0.8); g.stroke(); });
  }
  g.fillStyle = 'rgba(255,110,110,0.32)';
  ellipse(g, -r * 0.58, r * 0.36, r * 0.15, r * 0.08); g.fill(); ellipse(g, r * 0.58, r * 0.36, r * 0.15, r * 0.08); g.fill();
  g.strokeStyle = 'rgba(190,110,80,0.55)'; g.lineWidth = r * 0.04;
  g.beginPath(); g.moveTo(-r * 0.03, r * 0.26); g.quadraticCurveTo(0, r * 0.3, r * 0.03, r * 0.26); g.stroke();
  const my = r * 0.46;
  g.strokeStyle = '#4a1d12'; g.lineWidth = r * 0.055;
  switch (expr) {
    case 'happy': case 'love':
      g.beginPath(); g.moveTo(-r * 0.2, my - r * 0.06); g.quadraticCurveTo(0, my + r * 0.28, r * 0.2, my - r * 0.06); g.closePath();
      g.fillStyle = '#7a2a20'; g.fill(); g.stroke();
      g.save(); g.clip(); g.fillStyle = '#ee7070'; ellipse(g, 0, my + r * 0.14, r * 0.12, r * 0.08); g.fill(); g.restore();
      break;
    case 'shock':
      ellipse(g, 0, my + r * 0.04, r * 0.08, r * 0.11); g.fillStyle = '#5a1f17'; g.fill(); g.stroke();
      break;
    case 'worry':
      g.beginPath(); g.moveTo(-r * 0.15, my + r * 0.04);
      for (let i = 1; i <= 6; i++) g.lineTo(-r * 0.15 + i * r * 0.05, my + r * 0.04 + (i % 2 ? -r * 0.04 : 0));
      g.stroke();
      break;
    case 'sad':
      g.beginPath(); g.arc(0, my + r * 0.16, r * 0.14, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
      break;
    default:
      g.beginPath(); g.arc(0, my - r * 0.1, r * 0.15, Math.PI * 0.2, Math.PI * 0.8); g.stroke();
  }
  if (expr === 'worry' || expr === 'shock') {
    g.save(); g.translate(r * 0.78, -r * 0.25);
    g.beginPath(); g.moveTo(0, -r * 0.16); g.quadraticCurveTo(r * 0.11, r * 0.02, 0, r * 0.06); g.quadraticCurveTo(-r * 0.11, r * 0.02, 0, -r * 0.16);
    g.fillStyle = '#bfe6ff'; g.fill(); g.strokeStyle = '#4b8fc4'; g.lineWidth = Math.max(1, r * 0.025); g.stroke();
    g.restore();
  }
}

function gradeWord(q) {
  if (q >= 0.95) return '完美';
  if (q >= 0.85) return '很棒';
  if (q >= 0.72) return '不錯';
  if (q >= 0.55) return '普通';
  if (q >= 0.35) return '危險';
  return '慘';
}
function stampWord(q) {
  if (q >= 0.95) return '完美！';
  if (q >= 0.85) return '讚啦！';
  if (q >= 0.72) return '不錯喔';
  if (q >= 0.55) return '還可以';
  if (q >= 0.35) return '有點危險';
  return '慘了啦';
}
function qColor(q) {
  const hue = q < 0.5 ? lerp(6, 38, q / 0.5) : lerp(38, 118, (q - 0.5) / 0.5);
  return `hsl(${hue.toFixed(0)} 68% 46%)`;
}

function stepQuip(i, q, info) {
  const Q = STEP_QUIPS[i];
  if (q >= 0.9) return pick(Q.great);
  if (i === 0) { if (info.splashes >= 3) return pick(Q.splash); if (info.lumps > 0.35) return pick(Q.lumpy); return pick(q >= 0.72 ? Q.good : Q.meh); }
  if (i === 1) return pick(info.V > 1 ? Q.over : Q.under);
  if (i === 2) return pick(info.coverage < 0.88 ? Q.holes : Q.uneven);
  if (i === 3) {
    if (info.count > 24) return pick(Q.stuffed);
    if (info.count < 3) return pick(Q.few);
    if (info.acc < 0.7) return pick(Q.outside);
    return pick(Q.good);
  }
  if (info.bumps >= 2) return pick(Q.bumps);
  return pick(q >= 0.72 ? Q.good : Q.tilt);
}

/* a roast (or a compliment) aimed at one specific step */
function stepRemark(results) {
  let worst = 0, best = 0;
  results.forEach((r, i) => { if (r.q < results[worst].q) worst = i; if (r.q > results[best].q) best = i; });
  const w = results[worst], info = w.info || {};
  if (w.q < 0.62) {
    switch (worst) {
      case 0: return info.splashes >= 3 ? '你攪麵糊的氣勢像在打架，我衣服上現在都是麵糊。' : '麵糊裡好多小顆粒，我還以為你加了珍珠，正想問要不要加十塊。';
      case 1: return info.V > 1 ? '麵糊倒那麼多，這是可麗餅還是鬆餅？我分不出來。' : '麵糊少成這樣，薄到可以透光看見我的未來。';
      case 2: return info.coverage < 0.85 ? '可麗餅上好多洞，可以直接拿去當濾網。' : '厚的地方像床墊、薄的地方像衛生紙，層次好豐富。';
      case 3:
        if (info.count > 24) return '料多到紙筒在喊救命，我的嘴也在喊救命。';
        if (info.count < 3) return '料少到我以為我點的是空氣口味。';
        return '料都放在邊邊，一摺起來全部掉光光，地板吃得很開心。';
      default: return info.bumps >= 2 ? '紙筒被你戳得皺巴巴，看起來比我上班還累。' : '放得歪歪的，比薩斜塔看到都要叫你一聲前輩。';
    }
  }
  const b = results[best];
  if (b.q >= 0.95) {
    return [
      '麵糊攪得滑順到可以拿來敷臉，這是最高讚美。',
      '倒麵糊的量完美到我懷疑你身上有裝秤。',
      '鐵板上那個圓，圓到數學老師看了會感動落淚。',
      '醬料和配料擺得剛剛好，每一口都吃得到料！',
      '放進紙筒的瞬間好俐落，根本是可麗餅界的灌籃。'
    ][best];
  }
  return '';
}

/* free-creation flavour commentary (never affects the score) */
function comboRemark(sauces, tops) {
  const has = k => tops.has(k), hs = k => sauces.has(k);
  const savoryMeat = ['tuna', 'ham', 'floss'].filter(has);
  if (sauces.size === 0 && tops.size === 0) return '什麼都沒加，這是傳說中的素顏可麗餅。';
  if (tops.size >= 8) return '你把整個料理台都放進去了吧？這是可麗餅還是百寶袋？';
  if (hs('choco') && savoryMeat.length) return `巧克力配${TOP[savoryMeat[0]].name}……這口味大膽到我需要先坐下。`;
  if (hs('condensed') && has('tuna')) return '煉乳鮪魚？你是想讓我永遠記得今天嗎？';
  if (has('sprinkles') && savoryMeat.length) return `彩色米配${TOP[savoryMeat[0]].name}，好像兒童節跟年夜飯撞在一起。`;
  if (hs('mayo') && (has('banana') || has('strawberry'))) return '水果配沙拉醬，是阿嬤那個年代的經典台味！';
  if (has('floss') && hs('mayo')) return '肉鬆配沙拉醬，麵包店的靈魂被你召喚出來了。';
  if (has('floss') && hs('peanut')) return '花生配肉鬆，吃起來有潤餅的味道，好懂吃！';
  if (hs('jam') && has('cheese')) return '草莓醬配起司，好像……其實有點好吃？';
  if (hs('choco') && has('banana')) return '巧克力香蕉，經典不敗，你很懂。';
  if (has('lettuce') && tops.size === 1) return '只放生菜？你是不是怕我變胖？';
  if (sauces.size === 0) return '居然沒有醬？這是素顏可麗餅嗎？';
  if (tops.size === 0) return '只有醬，連一片香蕉都捨不得給我？';
  return '';
}

/* ============================================================
   The five steps + cutscenes
   Every step exposes: enter, update, draw, down/move/up,
   progress (0..1), quality (0..1 | null), ghost(t) for the hint.
   ============================================================ */
const GRID_N = 96, GRID_EXT = 1.06, GRID_CS = 2 * GRID_EXT / GRID_N;
const R_STAR = 0.45;          // ideal puddle radius (crepe radii)
const BAR_HALF = 0.29;        // half-length of the T bar (crepe radii)
const ZONE_HA = 0.8, ZONE_R0 = 0.14, ZONE_R1 = 0.94;
const SG = 48, SG_EXT = 1.12, SG_CS = 2 * SG_EXT / SG;

const BATTER_RES = 176;
const BATTER_NOISE = (() => { const a = new Float32Array(BATTER_RES * BATTER_RES); for (let y = 0; y < BATTER_RES; y++) for (let x = 0; x < BATTER_RES; x++) a[y * BATTER_RES + x] = 0.65 * Noise.n2(x * 0.16, y * 0.16) + 0.35 * Noise.n2(x * 0.45 + 30, y * 0.45 + 11); return a; })();
const INSIDE = new Uint8Array(GRID_N * GRID_N);
let INSIDE_COUNT = 0;
for (let y = 0; y < GRID_N; y++) for (let x = 0; x < GRID_N; x++) {
  const u = -GRID_EXT + (x + 0.5) * GRID_CS, v = -GRID_EXT + (y + 0.5) * GRID_CS;
  if (u * u + v * v <= 1) { INSIDE[y * GRID_N + x] = 1; INSIDE_COUNT++; }
}
function inZone(u, v) {
  const r = Math.hypot(u, v);
  if (r < ZONE_R0 || r > ZONE_R1) return false;
  return Math.abs(angDiff(-Math.PI / 2, Math.atan2(v, u))) <= ZONE_HA;
}
const ZONE_MASK = new Uint8Array(SG * SG), CREPE_MASK = new Uint8Array(SG * SG);
let ZONE_COUNT = 0;
for (let y = 0; y < SG; y++) for (let x = 0; x < SG; x++) {
  const u = -SG_EXT + (x + 0.5) * SG_CS, v = -SG_EXT + (y + 0.5) * SG_CS, i = y * SG + x;
  if (inZone(u, v)) { ZONE_MASK[i] = 1; ZONE_COUNT++; }
  if (u * u + v * v <= 1) CREPE_MASK[i] = 1;
}

const n2s = (u, v) => [L.cx + u * L.Rc, L.cy + v * L.Rc];
const s2n = (x, y) => [(x - L.cx) / L.Rc, (y - L.cy) / L.Rc];

function drawMachine(g, ox = 0) {
  const m = C.machine;
  g.drawImage(m.canvas, L.cx - m.size / 2 + ox, L.cy - m.size / 2, m.size, m.size);
}

function canvasLabel(g, text, x, y, size, color = '#fffaf0') {
  g.save();
  g.font = `${size}px "Huninn", "PingFang TC", "Noto Sans TC", sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = size * 0.32; g.strokeStyle = 'rgba(40,22,14,0.92)';
  g.strokeText(text, x, y); g.fillStyle = color; g.fillText(text, x, y);
  g.restore();
}

/* ============ STEP 1 — mix the batter ============ */
function mixScore(v) {
  if (v < 2.2) return 0.3 + 0.7 * Math.pow(v / 2.2, 1.4);
  if (v <= 7.6) return 1;
  return Math.max(0.12, 1 - (v - 7.6) / 4.2);
}
const StepMix = {
  enter() {
    Object.assign(this, {
      progress: 0, quality: null, qSum: 0, qW: 0, speed: 0, accDist: 0, accAng: 0, rot: 0, omega: 0,
      isDown: false, w: { x: 0.34, y: 0.24 }, trail: [], splashCD: 0, splashes: 0, started: false, idle: 0,
      done: false, talkT: 3.5, slowT: 0
    });
    this.lumps = [];
    for (let i = 0; i < 16; i++) this.lumps.push({ a: Math.random() * TAU, r: 0.15 + Math.sqrt(Math.random()) * 0.62, hp: 0.85 + Math.random() * 0.15, s: 0.75 + Math.random() * 0.5 });
    G.stains = [];
  },
  bowlPos(p) { const b = L.bowl; let x = (p.x - b.x) / b.Rs, y = (p.y - b.y) / b.Rs; const r = Math.hypot(x, y), m = 0.84; if (r > m) { x *= m / r; y *= m / r; } return { x, y }; },
  down(p) {
    if (this.done) return;
    this.isDown = true; this.started = true; this.idle = 0;
    this.w = this.bowlPos(p);
    Sound.loop('whisk', 'bandpass', 2300, 0.8);
  },
  move(p) {
    if (!this.isDown || this.done) return;
    const q = this.bowlPos(p);
    this.accDist += Math.hypot(q.x - this.w.x, q.y - this.w.y);
    if (Math.hypot(q.x, q.y) > 0.12 && Math.hypot(this.w.x, this.w.y) > 0.12) this.accAng += angDiff(Math.atan2(this.w.y, this.w.x), Math.atan2(q.y, q.x));
    this.w = q;
  },
  up() { this.isDown = false; },
  update(dt) {
    const dist = this.accDist; this.accDist = 0;
    const inst = dist / Math.max(dt, 1e-3);
    this.speed = lerp(this.speed, this.isDown ? inst : 0, 1 - Math.exp(-dt * 7));
    const angVel = this.accAng / Math.max(dt, 1e-3); this.accAng = 0;
    this.omega = lerp(this.omega, this.isDown ? angVel * 0.5 : 0, 1 - Math.exp(-dt * (this.isDown ? 3 : 1.1)));
    this.rot += this.omega * dt;
    Sound.level('whisk', this.isDown ? clamp(this.speed / 10, 0, 1) * 0.32 : 0);
    if (this.isDown) this.idle = 0; else this.idle += dt;
    if (this.isDown && dist > 0) this.trail.push({ a: Math.atan2(this.w.y, this.w.x) - this.rot, r: Math.hypot(this.w.x, this.w.y), t: G.t });
    this.trail = this.trail.filter(p => G.t - p.t < 1.3);
    const needle = $('needle');
    if (needle) needle.style.left = `${(clamp(this.speed / 12, 0, 1) * 100).toFixed(1)}%`;
    if (this.done) return;
    if (dist > 0) {
      const sc = mixScore(this.speed), dp = dist / 34;
      this.progress = Math.min(1, this.progress + dp);
      this.qSum += sc * dp; this.qW += dp; this.quality = this.qSum / this.qW;
      for (const l of this.lumps) {
        if (l.hp <= 0) continue;
        l.hp -= dp * 2.3 * sc;
        const la = l.a + this.rot;
        if (Math.hypot(Math.cos(la) * l.r - this.w.x, Math.sin(la) * l.r - this.w.y) < 0.24) l.hp -= dt * 1.6 * sc;
        if (l.hp <= 0) {
          const b = L.bowl;
          spawn({ type: 'poof', x: b.x + Math.cos(la) * l.r * b.Rs, y: b.y + Math.sin(la) * l.r * b.Rs, life: 0.5, max: 0.5, size: b.Rs * 0.08 });
        }
      }
    }
    if (this.isDown && this.speed > 9.3) {
      this.splashCD -= dt;
      if (this.splashCD <= 0) { this.splashCD = 0.4; this.splashes++; this.splash(); }
    }
    this.talkT -= dt;
    if (this.isDown && this.talkT <= 0) {
      if (this.speed > 2.2 && this.speed < 7.6 && Math.random() < 0.5) { say(pick(CHATTER.mixGood)); this.talkT = 5; }
      else if (this.speed < 1.6) { this.slowT += 1; if (this.slowT > 1) { say(pick(CHATTER.mixSlow)); this.talkT = 5; } }
      else this.talkT = 1.5;
    }
    if (this.progress >= 1) {
      this.done = true; this.isDown = false; Sound.level('whisk', 0);
      const lumps = this.lumps.reduce((a, l) => a + Math.max(0, l.hp), 0) / this.lumps.length;
      G.crepe.lump = lumps;
      finishStep(this.quality, { splashes: this.splashes, lumps });
    }
  },
  splash() {
    const b = L.bowl, wx = b.x + this.w.x * b.Rs, wy = b.y + this.w.y * b.Rs;
    let ox = this.w.x, oy = this.w.y; const r = Math.hypot(ox, oy) || 1; ox /= r; oy /= r;
    const tx = -oy * Math.sign(this.omega || 1), ty = ox * Math.sign(this.omega || 1);
    for (let i = 0; i < 6; i++) {
      const sp = rr(260, 560), mix = rr(0.2, 0.8);
      const dx = ox * (1 - mix) + tx * mix, dy = oy * (1 - mix) + ty * mix;
      spawn({ type: 'splash', x: wx, y: wy, vx: dx * sp, vy: dy * sp, z: 0, vz: rr(140, 280), r: rr(3, 7), life: 3, max: 3, seed: Math.random() * 1e5 });
    }
    Sound.splat(); buzz(25);
    react('shock', 1.2);
    if (this.splashes === 1 || Math.random() < 0.45) say(pick(CHATTER.splash));
  },
  ghost(t) {
    const b = L.bowl, a = t * 5.2;
    return { x: b.x + Math.cos(a) * b.Rs * 0.48, y: b.y + Math.sin(a) * b.Rs * 0.42, press: true };
  },
  draw(g, ox = 0) {
    const b = L.bowl, Rs = b.Rs, bx = b.x + ox, by = b.y;
    g.drawImage(C.mixProps, ox, 0, L.W, L.H);
    for (const st of G.stains) drawStain(g, st.x + ox, st.y, st.r, st.seed);
    g.drawImage(C.bowl.canvas, bx - C.bowl.size / 2, by - C.bowl.size / 2, C.bowl.size, C.bowl.size);
    g.save(); circle(g, bx, by, Rs); g.clip();
    const mixA = sstep(0, 0.92, this.progress);
    g.save(); g.translate(bx, by); g.rotate(this.rot);
    if (mixA < 1) g.drawImage(C.ingr, -Rs, -Rs, 2 * Rs, 2 * Rs);
    if (mixA > 0) { g.globalAlpha = mixA; g.drawImage(C.mixed, -Rs, -Rs, 2 * Rs, 2 * Rs); g.globalAlpha = 1; }
    const tr = this.trail;
    if (tr.length > 1) {
      g.lineCap = 'round'; g.lineJoin = 'round';
      for (let i = 1; i < tr.length; i++) {
        const p0 = tr[i - 1], p1 = tr[i], a = (1 - (G.t - p1.t) / 1.3) * (0.65 - mixA * 0.35);
        if (a <= 0) continue;
        g.strokeStyle = `rgba(241,219,158,${a.toFixed(3)})`; g.lineWidth = Rs * 0.22;
        g.beginPath(); g.moveTo(Math.cos(p0.a) * p0.r * Rs, Math.sin(p0.a) * p0.r * Rs); g.lineTo(Math.cos(p1.a) * p1.r * Rs, Math.sin(p1.a) * p1.r * Rs); g.stroke();
        g.strokeStyle = `rgba(255,252,238,${(a * 0.6).toFixed(3)})`; g.lineWidth = Rs * 0.04;
        g.stroke();
      }
    }
    for (const l of this.lumps) {
      if (l.hp <= 0.02) continue;
      const x = Math.cos(l.a) * l.r * Rs, y = Math.sin(l.a) * l.r * Rs, sz = Rs * 0.062 * l.s * Math.sqrt(l.hp);
      g.fillStyle = 'rgba(150,120,60,0.25)'; ellipse(g, x + sz * 0.25, y + sz * 0.35, sz, sz * 0.85); g.fill();
      g.fillStyle = '#efe4c7'; ellipse(g, x, y, sz, sz * 0.88, l.a); g.fill();
      g.fillStyle = '#fffaf0'; circle(g, x - sz * 0.3, y - sz * 0.3, sz * 0.42); g.fill();
    }
    g.restore();
    const wx = bx + this.w.x * Rs, wy = by + this.w.y * Rs;
    if (this.isDown) { circle(g, wx, wy, Rs * 0.24); g.strokeStyle = 'rgba(255,255,255,0.28)'; g.lineWidth = 2; g.stroke(); }
    const ig = g.createRadialGradient(bx, by, Rs * 0.8, bx, by, Rs);
    ig.addColorStop(0, 'rgba(70,45,20,0)'); ig.addColorStop(1, 'rgba(70,45,20,0.3)');
    g.fillStyle = ig; g.fillRect(bx - Rs, by - Rs, Rs * 2, Rs * 2);
    g.restore();
    circle(g, bx, by, Rs); g.strokeStyle = 'rgba(150,120,60,0.35)'; g.lineWidth = 1.5; g.stroke();
    drawWhisk(g, wx, wy, b.Rb);
  }
};

function drawStain(g, x, y, r, seed) {
  g.save(); g.translate(x, y);
  blobPath(g, r, mulberry32(seed | 0), 9, 0.45);

/* ============ STEP 2 — pour ============ */
function pourQ(V) {
  const err = Math.abs(Math.sqrt(V) - 1);
  return err <= 0.03 ? 1 : clamp(1 - Math.pow((err - 0.03) / 0.4, 1.15), 0, 1);
}
const StepPour = {
  enter() {
    Object.assign(this, { V: 0, pouring: false, tilt: 0, hold: 0, progress: 0, quality: null, done: false, ripples: [], started: false, idle: 0, lift: 0, saidOver: false, saidStart: false, spawnT: 0 });

  },
  down() {
    if (this.done) return;
    this.pouring = true; this.started = true; this.idle = 0;
    if (!this.saidStart) { this.saidStart = true; say(pick(CHATTER.pourStart)); }
  },
  move() {},
  up() {
    if (!this.pouring) return;
    this.pouring = false;
    if (this.done) return;
    if (this.V < 0.25) { setHint('再多倒一點喔！按住繼續倒'); say(pick(CHATTER.pourShort)); return; }
    this.finish();
  },
  finish() {
    if (this.done) return;
    this.done = true; this.pouring = false;
    Sound.level('pour', 0);
    G.crepe.V = this.V;
    finishStep(pourQ(this.V), { V: this.V });
  },
  get progText() { return `${Math.round(this.V * 100)}%`; },
  get progOver() { return this.V > 1.06; },
  update(dt) {
    if (this.pouring) { this.hold += dt; this.tilt = Math.min(1, this.tilt + dt / 0.28); this.idle = 0; }
    else { this.tilt = Math.max(0, this.tilt - dt / 0.22); this.idle += dt; }
    const flow = this.pouring ? 0.5 * this.tilt * (0.75 + 0.5 * Math.min(1, this.hold / 1.5)) : 0;
    this.V = Math.min(1.7, this.V + flow * dt);

    Sound.level('pour', flow > 0 ? 0.18 + flow * 0.35 : 0);
    Sound.level('sizzle', this.V > 0 ? 0.05 + Math.min(0.1, this.V * 0.08) : 0);
    Sound.crackle(dt, this.V > 0 ? 0.3 : 0);
    if (flow > 0) { this.spawnT -= dt; if (this.spawnT <= 0) { this.spawnT = 0.13; this.ripples.push({ t: 0 }); } }
    this.ripples.forEach(r => r.t += dt); this.ripples = this.ripples.filter(r => r.t < 0.8);
    this.progress = Math.min(1, this.V);

    if (this.done) this.lift = Math.min(1, this.lift + dt * 1.6);
    else if (this.V >= 1.7) this.finish();
  },
  ghost(t) {

    return { x: L.cx + L.Rc * 0.2, y: L.cy + L.Rc * 0.25, press: ph < 1.4, pulse: ph < 1.4 ? ph : 0 };
  },
  ladlePos() {

  },
  draw(g) {

      g.save(); g.globalAlpha = fade;

      g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = w * 0.25;
      g.beginPath(); g.moveTo(lipX - w * 0.2, lipY - w * 0.2); g.quadraticCurveTo((lipX + cx) / 2 - w * 0.2, (lipY + cy) / 2 - Rc * 0.05 - w * 0.2, cx - w * 0.2, cy - w * 0.2); g.stroke();

function drawPuddle(g, x, y, r, t, lump) {
  g.save();
  g.beginPath();
  for (let i = 0; i <= 48; i++) {
    const a = i / 48 * TAU;
    const k = 1 + 0.022 * Math.sin(3 * a + 0.7) + 0.016 * Math.sin(5 * a + 2.1) + 0.01 * Math.sin(8 * a + t * 0.6);
    const px = x + Math.cos(a) * r * k, py = y + Math.sin(a) * r * k;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
  g.fillStyle = 'rgba(30,15,5,0.35)'; g.save(); g.translate(1, 2); g.fill(); g.restore();
  const pg = g.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.05, x, y, r);
  pg.addColorStop(0, '#fff6d6'); pg.addColorStop(0.75, '#f3e2b1'); pg.addColorStop(1, '#e2c27e');
  g.fillStyle = pg; g.fill();
  g.strokeStyle = 'rgba(200,150,70,0.7)'; g.lineWidth = Math.max(1.5, r * 0.035); g.stroke();
  g.clip();
  g.fillStyle = 'rgba(255,255,255,0.55)';
  ellipse(g, x - r * 0.38, y - r * 0.45, r * 0.35, r * 0.12, -0.55); g.fill();
  const R = mulberry32(31);
  for (let i = 0; i < 14; i++) {
    const a = R() * TAU, d = r * (0.82 + R() * 0.14);
    circle(g, x + Math.cos(a) * d, y + Math.sin(a) * d, 1 + R() * 1.6);
    g.strokeStyle = 'rgba(190,140,60,0.5)'; g.lineWidth = 0.8; g.stroke();
  }
  if (lump > 0.05) {
    const n = Math.round(lump * 14);
    for (let i = 0; i < n; i++) {
      const a = R() * TAU, d = Math.sqrt(R()) * r * 0.8;
      g.fillStyle = '#fffaf0'; circle(g, x + Math.cos(a) * d, y + Math.sin(a) * d, 2 + R() * 2); g.fill();
    }
  }
  g.restore();
}

/* ============ STEP 3 — spread with the T tool ============ */
const StepSpread = {
  enter() {
    const N = GRID_N;
    this.h = new Float32Array(N * N);
    this.stampArr = new Uint32Array(N * N); this.stampId = 0;
    this.cells = new Int32Array(1024);

      this.h[i] = val; sum += val;
    }

    this.cv = mkCanvas(BATTER_RES, BATTER_RES); this.cx2 = this.cv.getContext('2d'); this.img = this.cx2.createImageData(BATTER_RES, BATTER_RES);
    this.marks = mkCanvas(256, 256); this.mg = this.marks.getContext('2d');
    this.mg.lineCap = 'butt'; this.mg.lineJoin = 'round'; this.mg.strokeStyle = 'rgba(70,35,10,0.035)'; this.mg.lineWidth = 3.2;
    Object.assign(this, {
      tool: { u: 0.62, v: 0.58, dx: 0, dy: -1, ang: Math.PI / 2 * 0 - 0.6, load: 0 },
      isDown: false, moveAcc: 0, toolSpeed: 0, time: 0, eff: 1, cook: 0, coverage: 0, meanDev: 1,
      progress: 0, quality: null, statT: 0, lost: 0, started: false, idle: 0, done: false, dirty: true,
      saidStart: false, saidSet: false, dripCD: 0, prevEnds: null, enterT: 0
    });
    this.tool.ang = -0.6;
    Sound.loop('scrape', 'bandpass', 950, 1.3); Sound.loop('sizzle', 'highpass', 3400, 0.6);
    this.stats(); this.renderGrid();
  },
  down(p) {
    if (this.done) return;
    const [u, v] = s2n(p.x, p.y);
    this.isDown = true; this.started = true; this.idle = 0;
    this.tool.u = clamp(u, -1.25, 1.25); this.tool.v = clamp(v, -1.25, 1.25); this.prevEnds = null;
    if (!this.saidStart) { this.saidStart = true; say(pick(CHATTER.spreadStart)); }
  },
  move(p) {

    const [u, v] = s2n(p.x, p.y);

  },
  up() { if (!this.isDown) return; this.isDown = false; this.prevEnds = null; },
  onDone() { if (!this.done && this.coverage >= 0.5) this.finish(); },
  spreadTo(u, v) {
    const t = this.tool, dx = u - t.u, dy = v - t.v, len = Math.hypot(dx, dy);
    if (len < 1e-4) return;
    this.moveAcc += len;
    const steps = Math.min(400, Math.ceil(len / (GRID_CS * 0.5))), sx = dx / steps, sy = dy / steps, sl = len / steps;
    for (let i = 0; i < steps; i++) {
      t.u += sx; t.v += sy;
      t.dx = lerp(t.dx, sx / sl, 0.3); t.dy = lerp(t.dy, sy / sl, 0.3);
      const m = Math.hypot(t.dx, t.dy) || 1; t.dx /= m; t.dy /= m;

  barCells(u, v, nx, ny) {

  },
  applyBar(u, v, dx, dy, sl) {

    if (t.load > 0) {

    spawn({ type: 'drip', x, y, vx: du * 22, vy: dv * 22, life: 1.6, max: 1.6, r: rr(3, 6) });
    if (!this.saidDrip && this.lost > 0.02 * INSIDE_COUNT) { this.saidDrip = true; say(pick(CHATTER.spreadDrip)); react('worry', 1.2); }
  },
  dropLoad() {

    if (n > 0) { const add = t.load / n; for (let i = 0; i < h.length; i++) if (INSIDE[i] && h[i] >= 0.45 * T) h[i] += add; }

  stats() {

  },
  blurField() {
    const N = GRID_N, h = this.h;
    if (!this.hb) { this.hb = new Float32Array(N * N); this.tmp = new Float32Array(N * N); this.shade = new Float32Array(N * N); }
    const t = this.tmp, o = this.hb, sh = this.shade;
    const at = (a, x, y) => (x < 0 || y < 0 || x >= N || y >= N) ? 0 : a[y * N + x];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) t[y * N + x] = (at(h, x - 2, y) + 4 * at(h, x - 1, y) + 6 * h[y * N + x] + 4 * at(h, x + 1, y) + at(h, x + 2, y)) / 16;

    const T = this.tStar;

    }

  },
  renderGrid() {
    const S = BATTER_RES, d = this.img.data, T = this.tStar, h = this.blurField(), cook = this.cook, N = GRID_N, shd = this.shade;
    const gold = [238, 196, 116], nz = BATTER_NOISE;
    const scale = (2 * GRID_EXT) / S / GRID_CS;
    const warp = 0.028 / GRID_CS;
    for (let py = 0; py < S; py++) {
      const v = -GRID_EXT + (py + 0.5) / S * 2 * GRID_EXT;
      for (let px = 0; px < S; px++) {
        const o = (py * S + px) * 4;
        const u = -GRID_EXT + (px + 0.5) / S * 2 * GRID_EXT;
        const r2 = u * u + v * v;
        if (r2 > 1) { d[o + 3] = 0; continue; }
        const fx = (px + 0.5) * scale - 0.5 + (nz[px * S + py] - 0.5) * warp;
        const fy = (py + 0.5) * scale - 0.5 + (nz[((py + 37) % S) * S + ((px + 53) % S)] - 0.5) * warp;
        const x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
        const i00 = y0 * N + x0;
        const okx0 = x0 >= 0 && x0 < N, okx1 = x0 + 1 >= 0 && x0 + 1 < N, oky0 = y0 >= 0 && y0 < N, oky1 = y0 + 1 >= 0 && y0 + 1 < N;
        const a00 = okx0 && oky0 ? h[i00] : 0, a10 = okx1 && oky0 ? h[i00 + 1] : 0;
        const a01 = okx0 && oky1 ? h[i00 + N] : 0, a11 = okx1 && oky1 ? h[i00 + N + 1] : 0;
        const hr = ((a00 + (a10 - a00) * tx) * (1 - ty) + (a01 + (a11 - a01) * tx) * ty) / T;
        const hp = hr + (nz[py * S + px] - 0.5) * 0.45;
        const sb = okx0 && oky0 ? shd[i00] : 0;
        let a = hp <= 0.16 ? 0 : hp >= 0.4 ? 1 : (hp - 0.16) / 0.24;
        a = a * a * (3 - 2 * a);
        if (r2 > 0.94) a *= clamp((1 - r2) / 0.06, 0, 1);
        if (a <= 0) { d[o + 3] = 0; continue; }
        let c = hr > 1.1 ? mixc(BATTER, BATTER_THICK, clamp((hr - 1.1) / 2.2, 0, 1)) : BATTER;

        d[o] = Math.min(255, c[0] * sh); d[o + 1] = Math.min(255, c[1] * sh); d[o + 2] = Math.min(255, c[2] * sh); d[o + 3] = a * 255;
      }
    }
    this.cx2.putImageData(this.img, 0, 0);
  },
  ghost(t) {
    const a = t * 3.2, r = 0.25 + 0.5 * ((t * 0.35) % 1);

  },
  drawBatter(g, alpha = 1) {

    g.drawImage(this.cv, L.cx - ext, L.cy - ext, ext * 2, ext * 2);

    const gl = g.createRadialGradient(gx, gy, 0, gx, gy, L.Rc * 0.9);
    gl.addColorStop(0, `rgba(255,255,255,${(0.16 * wet).toFixed(3)})`); gl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gl; g.fillRect(L.cx - L.Rc, L.cy - L.Rc, L.Rc * 2, L.Rc * 2);
    g.restore();
  },
  draw(g) {
    drawMachine(g);
    this.drawBatter(g);
    if (!this.done) {
      g.save(); g.setLineDash([5, 7]); g.lineDashOffset = G.t * 10;
      circle(g, L.cx, L.cy, L.Rc * 0.985); g.strokeStyle = `rgba(255,255,255,${(0.35 + 0.25 * Math.sin(G.t * 3)).toFixed(3)})`; g.lineWidth = 1.5; g.stroke();
      g.restore();
      const slide = easeOut(Math.min(1, this.enterT / 0.5));
      const [tx, ty] = n2s(this.tool.u + (1 - slide) * 1.4, this.tool.v);
      const loadN = this.tool.load / (INSIDE_COUNT * 0.05);
      drawTTool(g, tx, ty, this.tool.ang, BAR_HALF * 2 * L.Rc, L.Rc * 0.075, loadN);
    }
  }
};

/* ============ cutscene — cooking ============ */
const CutCook = {
  start() {
    this.t = 0; this.dur = 2.2; this.texDone = false; this.steamT = 0;

  },
  update(dt) {
    this.t += dt;

    if (this.texRun) { const late = this.t > this.dur - 0.8; if (this.texRun(late ? 1e9 : 7)) this.texRun = null; }
    const k = easeInOut(this.t / (this.dur - 0.5));
    StepSpread.cook = lerp(0.2, 1, k); StepSpread.renderGrid();
    Sound.crackle(dt, 0.9);

      this.steamT = 0.07;

      const [x, y] = n2s(Math.cos(a) * d, Math.sin(a) * d);
      spawn({ type: 'steam', x, y, vx: rr(-8, 8), vy: rr(-40, -25), life: 1.6, max: 1.6, size: L.Rc * rr(0.18, 0.3), seed: Math.random() * 10 });
    }

  },

    const a = sstep(this.dur - 0.75, this.dur - 0.15, this.t);
    StepSpread.drawBatter(g, 1);

      g.save(); g.globalAlpha = a;

function buildCrepeTextures(async) {
  const cr = G.crepe;
  if (!cr.h) return;
  const N = GRID_N, h = cr.h, T = cr.tStar || 1;
  const at = (x, y) => (x < 0 || y < 0 || x >= N || y >= N) ? 0 : h[y * N + x];
  const sampleH = (u, v) => {
    u += 0.026 * (Noise.n2(u * 9 + 2, v * 9) - 0.5); v += 0.026 * (Noise.n2(u * 9 + 7, v * 9 + 4) - 0.5);
    const fx = (u + GRID_EXT) / GRID_CS - 0.5, fy = (v + GRID_EXT) / GRID_CS - 0.5;
    const x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
    return lerp(lerp(at(x0, y0), at(x0 + 1, y0), tx), lerp(at(x0, y0 + 1), at(x0 + 1, y0 + 1), tx), ty) / T;
  };
  let marksAt = null;
  if (cr.marks) {
    const md = cr.marks.getContext('2d').getImageData(0, 0, 256, 256).data;
    marksAt = (u, v) => { const x = clamp(((u + 1) * 128) | 0, 0, 255), y = clamp(((v + 1) * 128) | 0, 0, 255); return md[(y * 256 + x) * 4 + 3] / 255; };
  }
  const size = Math.min(700, L.Rc * 2 * L.dpr);
  const jobs = [
    { key: 'topTex', job: crepeTexJob(size, sampleH, marksAt, { lump: cr.lump || 0 }) },
    { key: 'botTex', job: crepeTexJob(Math.min(480, size), sampleH, marksAt, { under: true }) }
  ];
  const run = budget => {
    for (const j of jobs) { if (!j.job.done) { j.job.step(budget); if (j.job.done) cr[j.key] = j.job.canvas; else return false; } }
    return true;
  };
  if (!async) { run(1e9); return null; }
  return run;
}

/* ============ STEP 4 — sauce & toppings ============ */
function countFactor(n) {
  if (n <= 4) return [0.55, 0.7, 0.78, 0.86, 0.93][n];
  if (n <= 16) return 1;
  if (n <= 24) return 0.93;
  if (n <= 34) return 0.82;
  return 0.7;
}
const StepFill = {
  enter() {
    Object.assign(this, {
      strokes: [], tops: [], actions: [], tab: 'sauce', sel: 'choco', selByTab: { sauce: 'choco', sweet: 'banana', savory: 'tuna' },
      sauceGrid: new Uint8Array(SG * SG), ink: 0, cur: null, batch: null, lastPlace: null,
      started: false, idle: 0, done: false, progress: 0, quality: null, info: { count: 0, acc: 1 },
      saidSauce: false, saidTop: false, saidOut: false, saidStuffed: false, finger: null
    });
    G.crepe.strokes = this.strokes; G.crepe.tops = this.tops;
    Sound.loop('squeeze', 'bandpass', 650, 3);
    setPickerTab('sauce');
    this.stats();
  },
  select(tab, key) {
    this.tab = tab; this.sel = key; this.selByTab[tab] = key;
    setHint(tab === 'sauce' ? `用手指在虛線區畫上${SAUCE[key].name}` : `點一下放${TOP[key].name}，拖曳可以連續放`);
  },
  down(p) {
    if (this.done) return;
    const [u, v] = s2n(p.x, p.y);
    if (Math.hypot(u, v) > 1.2) return;
    this.started = true; this.idle = 0; this.finger = p;
    if (this.tab === 'sauce') {
      const st = { type: this.sel, pts: [[u, v]] };
      this.strokes.push(st); this.cur = st; this.actions.push({ kind: 'stroke', st });
      this.mark(u, v, u, v, st.type);
      Sound.squish();
      if (!this.saidSauce) { this.saidSauce = true; say(pick(CHATTER.firstSauce)); react('happy', 1.2); }
      if (Math.hypot(u, v) > 1) this.smoke(p.x, p.y);
    } else {
      this.batch = { kind: 'tops', items: [] }; this.actions.push(this.batch);
      this.place(u, v);
    }
    this.stats();
  },
  move(p) {
    if (this.done) return;
    this.finger = p;
    const [u, v] = s2n(p.x, p.y);
    if (this.cur) {
      const pts = this.cur.pts, last = pts[pts.length - 1];
      const d = Math.hypot(u - last[0], v - last[1]);
      if (d >= 0.016 && pts.length < 500) {
        pts.push([u, v]); this.mark(last[0], last[1], u, v, this.cur.type);
        Sound.level('squeeze', 0.18, 0.03);
        this.sqT = 0.08;
        if (Math.hypot(u, v) > 1 && Math.random() < 0.2) this.smoke(p.x, p.y);
      }
    } else if (this.batch && this.lastPlace) {
      if (Math.hypot(u - this.lastPlace[0], v - this.lastPlace[1]) >= TOP[this.sel].gap) this.place(u, v);
    }
  },
  up() {
    if (this.cur) { this.cur = null; Sound.level('squeeze', 0); this.stats(); }
    if (this.batch) { if (!this.batch.items.length) this.actions.pop(); this.batch = null; }
    this.finger = null;
  },
  smoke(x, y) { spawn({ type: 'smoke', x, y, vx: rr(-10, 10), vy: rr(-40, -25), life: 1, max: 1, size: L.Rc * 0.12 }); },
  place(u, v) {
    if (Math.hypot(u, v) > 1.12) return;
    if (this.tops.length >= 45) { say(pick(CHATTER.full)); return; }
    const it = { type: this.sel, u: u + rr(-0.012, 0.012), v: v + rr(-0.012, 0.012), rot: rr(0, TAU), seed: (Math.random() * 1e9) | 0, born: G.t };
    it.sprite = makeToppingSprite(it.type, TOP[it.type].size * L.Rc, it.seed, L.dpr);
    this.tops.push(it); this.batch && this.batch.items.push(it); this.lastPlace = [u, v];

    if (!inZone(u, v) && !this.saidOut) { this.saidOut = true; say(pick(CHATTER.outside)); react('worry', 1.3); }
    else if (!this.saidTop) { this.saidTop = true; say(pick(CHATTER.firstTop)); react('happy', 1.2); }
    if (this.tops.length === 25 && !this.saidStuffed) { this.saidStuffed = true; say(pick(CHATTER.stuffed)); react('shock', 1.3); }
    this.stats();
  },
  undo() {

    if (!a) return;
    if (a.kind === 'stroke') { const i = this.strokes.indexOf(a.st); if (i >= 0) this.strokes.splice(i, 1); this.rebuildGrid(); }
    else a.items.forEach(it => { const i = this.tops.indexOf(it); if (i >= 0) this.tops.splice(i, 1); });
    Sound.click(); this.stats();
  },
  mark(u0, v0, u1, v1, type) {
    const w = SAUCE[type].w * 0.5 + SG_CS * 0.35;
    const minx = Math.max(0, Math.floor((Math.min(u0, u1) - w + SG_EXT) / SG_CS)), maxx = Math.min(SG - 1, Math.floor((Math.max(u0, u1) + w + SG_EXT) / SG_CS));
    const miny = Math.max(0, Math.floor((Math.min(v0, v1) - w + SG_EXT) / SG_CS)), maxy = Math.min(SG - 1, Math.floor((Math.max(v0, v1) + w + SG_EXT) / SG_CS));

      const cu = -SG_EXT + (x + 0.5) * SG_CS, cv = -SG_EXT + (y + 0.5) * SG_CS;
      let t = L2 > 0 ? ((cu - u0) * dx + (cv - v0) * dy) / L2 : 0; t = clamp(t, 0, 1);
      const px = u0 + dx * t - cu, py = v0 + dy * t - cv;
      if (px * px + py * py <= w * w) { const i = y * SG + x; if (this.sauceGrid[i] < 255) this.sauceGrid[i]++; this.ink++; }
    }
  },
  rebuildGrid() {
    this.sauceGrid.fill(0); this.ink = 0;
    for (const st of this.strokes) {
      const p = st.pts;
      this.mark(p[0][0], p[0][1], p[0][0], p[0][1], st.type);
      for (let i = 1; i < p.length; i++) this.mark(p[i - 1][0], p[i - 1][1], p[i][0], p[i][1], st.type);
    }
  },
  stats() {
    let zc = 0, out = 0, off = 0, covered = 0;

      if (ZONE_MASK[i]) zc++; else if (CREPE_MASK[i]) out++; else off++;
    }

    const fS = hasS ? 0.78 + 0.22 * sstep(0.1, 0.42, covZone) : 0.8;

    this.info = { count, inZone: inZ, acc, covZone, dens, hasSauce: hasS };

  },
  onDone() {

  },
  finish() {

  update(dt) {

    this.fallers = G.crepe.tops.filter(t => !inZone(t.u, t.v)).map(t => {
      const v = t.v > 0 ? -t.v * 0.9 : t.v;
      const [x, y] = n2s(t.u, v);
      const dir = t.u >= 0 ? 1 : -1;
      return { it: t, x, y, vx: dir * rr(60, 140), vy: rr(-120, -40), rot: t.rot, vr: rr(-6, 6), started: false };
    });
    Sound.whoosh();
    StepWrap.prepare();
  },
  update(dt) {
    this.t += dt;
    if (this.phase === 0 && this.t > 1.0) { this.phase = 1; Sound.slide(); if (this.fallers.length) Timers.after(0.25, () => { Sound.plop(); if (this.fallers.length > 2) { say(pick(['料掉出來了啦！', '欸，掉了掉了'])); react('worry', 1.2); } }); }
    if (this.phase === 1 && this.t > 2.05) { this.phase = 2; Sound.whoosh(); }
    if (this.t > 1.25) for (const f of this.fallers) {
      f.started = true; f.vy += 900 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
    }
    if (this.t >= this.dur) startStep(4);
  },
  draw(g) {
    const t = this.t, Rc = L.Rc, cx = L.cx, cy = L.cy, comp = this.comp, half = this.half;
    const fade = sstep(2.15, 2.85, t);
    drawMachine(g);
    if (t < 1.0) {
      const f = easeInOut(t / 1.0), sy = Math.cos(f * Math.PI);
      g.save(); g.beginPath(); g.rect(cx - half, cy - half, half * 2, half); g.clip();
      g.drawImage(comp, cx - half, cy - half, half * 2, half * 2); g.restore();
      g.save(); g.translate(cx, cy); g.scale(1, sy);
      g.beginPath(); g.rect(-half, 0, half * 2, half); g.clip();
      if (sy > 0) g.drawImage(comp, -half, -half, half * 2, half * 2);
      else if (G.crepe.botTex) g.drawImage(G.crepe.botTex, -Rc, -Rc, Rc * 2, Rc * 2);
      g.fillStyle = `rgba(40,20,5,${(0.45 * (1 - Math.abs(sy))).toFixed(3)})`;
      circle(g, 0, 0, Rc); g.fill();
      g.restore();
      if (sy < 0) {
        g.save(); g.strokeStyle = 'rgba(90,45,12,0.6)'; g.lineWidth = 2;
        g.beginPath(); g.moveTo(cx - Rc, cy); g.lineTo(cx + Rc, cy); g.stroke(); g.restore();
      }
    } else {
      const f = t < 2.05 ? easeInOut((t - 1.0) / 1.05) : 1;
      const al = lerp(Math.PI / 2, 0.44, f);
      const lift = t > 2.05 ? easeInOut((t - 2.05) / 0.8) : 0;
      g.save();
      g.translate(cx, cy - lift * Rc * 0.15); g.scale(1 + lift * 0.08, 1 + lift * 0.08);
      g.globalAlpha = 1 - fade;
      softShadow(g, 6, 10 + lift * 20, Rc * Math.sin(al) * 0.9 + 10, Rc * 0.5, 0.35);
      g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, Rc, -Math.PI / 2 - al, -Math.PI / 2 + al); g.closePath();
      g.save(); g.clip();
      if (G.crepe.botTex) g.drawImage(G.crepe.botTex, -Rc, -Rc, Rc * 2, Rc * 2);
      const sh = g.createLinearGradient(-Rc * Math.sin(al), 0, Rc * Math.sin(al), 0);
      sh.addColorStop(0, 'rgba(60,25,5,0.45)'); sh.addColorStop(0.3, 'rgba(255,230,190,0.12)'); sh.addColorStop(0.7, 'rgba(60,25,5,0.1)'); sh.addColorStop(1, 'rgba(60,25,5,0.5)');
      g.fillStyle = sh; g.fillRect(-Rc, -Rc, Rc * 2, Rc);
      g.strokeStyle = 'rgba(80,38,10,0.55)'; g.lineWidth = 2.5;
      [-0.45, 0.2].forEach(k => { const a = -Math.PI / 2 + al * k; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * Rc, Math.sin(a) * Rc); g.stroke(); });
      g.restore();
      g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, Rc, -Math.PI / 2 - al, -Math.PI / 2 + al); g.closePath();
      g.strokeStyle = '#5a3110'; g.lineWidth = 2; g.stroke();
      const items = G.crepe.coneItems || [];
      const show = sstep(0.35, 0.9, f);
      if (show > 0) {
        g.globalAlpha = (1 - fade) * show;
        items.slice(0, 10).forEach((it, i, arr) => {
          const k2 = arr.length === 1 ? 0 : i / (arr.length - 1) * 2 - 1;
          const a = -Math.PI / 2 + k2 * al * 0.7, rad = Rc * (0.9 + (i % 2) * 0.06);
          const sp = it.sprite;
          g.save(); g.translate(Math.cos(a) * rad, Math.sin(a) * rad); g.rotate(it.rot); g.scale(0.85, 0.85);
          g.drawImage(sp.canvas, -sp.half, -sp.half, sp.half * 2, sp.half * 2); g.restore();
        });
      }
      g.restore();
      for (const fl of this.fallers) {
        if (!fl.started) continue;
        const sp = fl.it.sprite;
        g.save(); g.globalAlpha = clamp(1 - (t - 1.25) / 1.1, 0, 1) * (1 - fade); g.translate(fl.x, fl.y); g.rotate(fl.rot);
        g.drawImage(sp.canvas, -sp.half, -sp.half, sp.half * 2, sp.half * 2); g.restore();
      }
    }
    if (fade > 0) {
      g.save();
      g.globalAlpha = Math.min(1, fade * 2);
      g.drawImage(C.night, 0, 0, L.W, L.H);
      if (fade > 0.5) { g.globalAlpha = (fade - 0.5) * 2; StepWrap.drawScene(g); }
      g.restore();
    }
  }
};

/* ============ STEP 5 — into the paper cone ============ */
const StepWrap = {
  prepare() {
    const f = L.f, st = L.stage;
    this.fx = G.round.coneFx || 0.55;
    const startFx = this.fx < 0.5 ? 0.74 : 0.26;
    Object.assign(this, {
      gx: L.W * startFx, gy: st.y + st.h * 0.11, th: 0.0, om: 0, vx: 0, vy: 0,
      depth: 0, bumps: 0, crumple: 0, qSum: 0, qW: 0, bumpCD: 0, done: false, release: 0,
      progress: 0, quality: null, started: false, idle: 0, isDown: false, saidSwing: false, align: null, prepared: true, settle: 0
    });
    this.tx = this.gx; this.ty = this.gy;
    this.paperSeed = (Math.random() * 1e6) | 0;
  },
  enter() {
    if (!this.prepared) this.prepare();
    this.prepared = false;
  },
  get px() { return L.W * this.fx; },
  down(p) { if (this.done) return; this.isDown = true; this.started = true; this.idle = 0; this.lp = { x: p.x, y: p.y }; },
  move(p) { if (!this.isDown || this.done) return; this.tx += p.x - this.lp.x; this.ty += p.y - this.lp.y; this.lp = { x: p.x, y: p.y }; },
  up() { this.isDown = false; },
  update(dt) {
    const f = L.f, st = L.stage;
    if (this.gx == null || !isFinite(this.gx)) this.prepare();
    if (this.done) {
      this.release = Math.min(1, this.release + dt * 1.4);
      this.settle = Math.min(1, this.settle + dt * 3);
      this.th *= Math.exp(-dt * 8);
      this.gx = lerp(this.gx, this.px, 1 - Math.exp(-dt * 10));
      return;
    }
    if (this.isDown) this.idle = 0; else this.idle += dt;
    this.bumpCD -= dt;
    const hwP = f.pw / 2, hwC = f.cw / 2, cl = f.cl, py = f.py, px = this.px;
    this.tx = clamp(this.tx, hwC + 6, L.W - hwC - 6);
    this.ty = clamp(this.ty, st.y + 4, py + f.ph);
    const k = 1 - Math.exp(-dt * 16);
    let nx = lerp(this.gx, this.tx, k), ny = lerp(this.gy, this.ty, k);
    const vx = (nx - this.gx) / Math.max(dt, 1e-3), vy = (ny - this.gy) / Math.max(dt, 1e-3);
    const ax = (vx - this.vx) / Math.max(dt, 1e-3);
    this.vx = vx; this.vy = vy;
    const dFrac = clamp(this.depth / f.ph, 0, 1);
    const Lp = cl * 0.45, grav = 2400;
    const acc = (-grav * Math.sin(this.th) + clamp(ax, -6000, 6000) * 0.6 * Math.cos(this.th)) / Lp - 2.4 * this.om - this.th * 70 * dFrac;
    this.om += acc * dt; this.om *= Math.exp(-dt * 9 * dFrac);
    this.th = clamp(this.th + this.om * dt, -1.0, 1.0);
    if (!this.saidSwing && Math.abs(this.th) > 0.4) { this.saidSwing = true; say(pick(CHATTER.swing)); react('shock', 1); }
    const sinT = Math.sin(this.th), cosT = Math.cos(this.th), tanT = Math.tan(this.th);
    let d = ny + cl * cosT - py;
    const tipX = nx - cl * sinT;
    const prevDepth = this.depth;
    if (d <= 0) {
      this.depth = 0;
    } else if (prevDepth <= 0.5) {
      if (Math.abs(tipX - px) > hwP - 3) {
        ny = py - cl * cosT; d = 0; this.depth = 0;
        if (Math.abs(tipX - px) < hwP + 14 && vy > 140) this.bump();
        this.ty = Math.min(this.ty, ny + 2);
      } else this.depth = d;
    } else {
      const axisAtMouth = nx - (py - ny) * tanT;
      const offM = axisAtMouth - px, offT = (nx - cl * sinT) - px;
      const slack = hwP * 0.08;
      const tolM = hwP - hwC * (d / cl) + slack, tolT = hwP * (1 - d / f.ph) + slack;
      if (Math.abs(offM) > tolM || Math.abs(offT) > tolT) {
        if (d > prevDepth + 0.5 && this.bumpCD <= 0 && vy > 60) this.bump();
        d = Math.min(d, prevDepth);
        ny = py + d - cl * cosT;
        this.ty = Math.min(this.ty, ny + 4);
      }
      this.depth = d;
      const corr = (px - axisAtMouth) * Math.min(1, dt * 5) * clamp(d / (f.ph * 0.3), 0, 1);
      nx += corr; this.tx += corr;
    }
    this.gx = nx; this.gy = ny;
    const align = this.alignScore(nx, ny);
    this.align = align;
    if (this.depth > prevDepth) { const dd = this.depth - prevDepth; this.qSum += align * dd; this.qW += dd; }
    const full = f.ph * 0.86;
    this.progress = clamp(this.depth / full, 0, 1);
    this.quality = this.qW > 0 ? clamp(this.qSum / this.qW - 0.1 * this.bumps, 0, 1) : (this.started ? null : null);
    if (this.depth >= full) this.finish();
  },
  alignScore(nx, ny) {
    const f = L.f, hwP = f.pw / 2;
    const axisAtMouth = nx - (f.py - ny) * Math.tan(this.th);
    const e = Math.abs(axisAtMouth - this.px) / hwP;
    return clamp(1 - 1.4 * Math.max(0, e - 0.06) - 0.5 * Math.abs(this.th) / 0.4, 0, 1);
  },
  bump() {
    this.bumps++; this.bumpCD = 0.45; this.crumple = Math.min(2.5, this.crumple + 0.45);
    this.gy -= 8; this.ty -= 14; this.om += (Math.random() - 0.5) * 3;
    Sound.crinkle(); buzz(30); G.shake = 6;
    react('shock', 1); if (this.bumps === 1 || Math.random() < 0.5) say(pick(CHATTER.bump));
  },
  finish() {
    if (this.done) return;
    this.done = true; this.isDown = false;
    Sound.slide(); Timers.after(0.12, () => Sound.pop());
    const q = this.qW > 0 ? clamp(this.qSum / this.qW - 0.1 * this.bumps, 0, 1) : 0.5;
    this.quality = q;
    finishStep(q, { bumps: this.bumps });
  },
  ghost(t) {
    const f = L.f, ph = (t % 2.6) / 2.6;
    const sx = this.gx, sy = this.gy + f.cl * 0.5;
    const ex = this.px, ey = f.py + f.ph * 0.2;
    const k = easeInOut(clamp(ph * 1.3, 0, 1));
    return { x: lerp(sx, ex, k), y: lerp(sy, ey, k), press: ph < 0.85 };
  },
  drawScene(g) {
    const f = L.f, px = this.px, cr = G.crepe;
    drawRack(g, px, f.py, f.pw, f.ph, f.counterY, 'back');
    drawPaperBack(g, px, f.py, f.pw, f.ph);
    if (!this.done && this.depth <= 0.5) {
      g.save(); g.setLineDash([4, 6]);
      const aligned = this.align != null && this.align > 0.85;
      g.strokeStyle = aligned ? 'rgba(170,255,160,0.85)' : 'rgba(255,255,255,0.45)';
      g.lineWidth = 2;
      g.beginPath(); g.moveTo(px, f.py - f.ph * 0.25); g.lineTo(px, L.stage.y + 6); g.stroke();
      g.restore();
    }
    const tex = cr.topTex || C.demoTex;
    drawCrepeCone(g, { x: this.gx, y: this.gy, w: f.cw, len: f.cl, ang: this.th, tex, items: cr.coneItems || [], sauces: cr.coneSauces || [], seed: 5 });
    drawPaperFront(g, px, f.py, f.pw, f.ph, this.crumple, this.paperSeed);
    drawRack(g, px, f.py, f.pw, f.ph, f.counterY, 'front');
    const tongY = this.gy - f.cw * 0.12 - this.release * 60;
    if (this.release < 1) { g.save(); g.globalAlpha = 1 - this.release; drawTongs(g, this.gx, tongY, this.release); g.restore(); }
  },
  draw(g) {
    if (this.gx == null || !isFinite(this.gx)) this.prepare();
    g.drawImage(C.night, 0, 0, L.W, L.H);
    this.drawScene(g);
  }
};

/* ============ cutscene — slide from bowl to griddle ============ */
const CutSlide = {
  start() { this.t = 0; this.dur = 0.75; Sound.whoosh(); setStepHeader(1); showPane(1); },
  update(dt) { this.t += dt; if (this.t >= this.dur) startStep(1); },
  draw(g) {
    const k = easeInOut(this.t / this.dur), W = L.W;
    StepMix.draw(g, -k * W);
    drawMachine(g, (1 - k) * W);
  }
};

/* ============================================================
   Main — layout, loop, input, HUD, intro & results
   ============================================================ */
const $ = id => document.getElementById(id);
const app = $('app'), cv = $('cv'), ctx = cv.getContext('2d');
const L = { W: 0, H: 0, dpr: 1, stage: { x: 0, y: 0, w: 0, h: 0 }, cx: 0, cy: 0, R: 0, Rc: 0, bowl: {}, f: {} };
const C = {};
const G = {
  mode: 'intro', step: -1, t: 0, results: [], customer: CUSTOMERS[0], crepe: {}, parts: [], stains: [], round: {},
  exprT: 0, exprOverride: 'idle', bubbleT: 0, shake: 0, splatT: 0, best: null, ghostA: 0, stampAge: 0, stampSkip: null, cut: null
};
const STEPS = [StepMix, StepPour, StepSpread, StepFill, StepWrap];
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- layout ---------------- */
function layout() {
  const r = app.getBoundingClientRect();
  L.W = Math.max(280, r.width); L.H = Math.max(420, r.height);
  L.dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(L.W * L.dpr); cv.height = Math.round(L.H * L.dpr);
  const hud = $('hud'), panel = $('panel');
  const hudB = !hud.hidden ? hud.getBoundingClientRect().bottom - r.top : Math.min(200, L.H * 0.26);
  const panT = !panel.hidden ? panel.getBoundingClientRect().top - r.top : L.H - 120;
  L.stage = { x: 0, y: hudB + 6, w: L.W, h: Math.max(180, panT - hudB - 12) };
  L.cx = L.W / 2; L.cy = L.stage.y + L.stage.h / 2;
  L.R = Math.min(L.W * 0.44, L.stage.h * 0.45);
  L.Rc = L.R * 0.94;
  const Rb = Math.min(L.W * 0.4, L.stage.h * 0.4);
  L.bowl = { x: L.W / 2, y: L.cy, Rb, Rs: Rb * 0.8 };
  const st = L.stage, ph = st.h * 0.33, pw = Math.min(L.W * 0.36, st.h * 0.25);
  L.f = { py: st.y + st.h * 0.57, pw, ph, cw: pw * 0.8, cl: ph * 1.1, counterY: st.y + st.h * 0.93 };
  rebuildCaches();
}

function rebuildCaches() {
  const { W, H, dpr } = L;
  C.counter = mkCanvas(W * dpr, H * dpr);
  let g = C.counter.getContext('2d'); g.scale(dpr, dpr);
  paintCounter(g, W, H, Math.max(50, L.stage.y - 16));
  C.night = mkCanvas(W * dpr, H * dpr);
  g = C.night.getContext('2d'); g.scale(dpr, dpr);
  paintNight(g, W, H, L.stage.y, L.f.counterY);
  C.machine = renderMachine(L.R, dpr);
  C.bowl = renderBowl(L.bowl.Rb, dpr);
  C.ingr = renderIngredients(L.bowl.Rs, dpr);
  C.mixed = renderMixed(L.bowl.Rs, dpr);
  C.mixProps = mkCanvas(W * dpr, H * dpr);
  g = C.mixProps.getContext('2d'); g.scale(dpr, dpr);
  paintMixProps(g, W, H);
  if (!C.steam) C.steam = makeSteamSprite(dpr);
  if (!C.demoTex) C.demoTex = genCrepeTexture(320, (u, v) => 1 + 0.15 * Math.sin(u * 7 + v * 5), null);
  if (G.crepe && G.crepe.h && G.crepe.topTex) buildCrepeTextures();
  if (G.step === 3 && G.mode === 'play') StepFill.relayout();
  if (G.crepe && G.crepe.tops) for (const it of G.crepe.tops) if (it.sprite) it.sprite = makeToppingSprite(it.type, TOP[it.type].size * L.Rc, it.seed, L.dpr);
}

let resizeTimer = null;
function onResize() { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { layout(); if (G.mode === 'intro') sizeHero(); }, 120); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

/* ---------------- HUD ---------------- */
const hudC = { p: -1, q: -2, pt: '', over: null };
function setHint(text) { $('stepHint').textContent = text; }
function setStepHeader(i) {
  $('stepNo').textContent = `STEP ${i + 1} / 5`;
  $('stepTitle').textContent = STEP_INFO[i].title;
  setHint(STEP_INFO[i].hint);
  [...$('chips').children].forEach((el, k) => {
    el.classList.toggle('on', k === i);
    const r = G.results[k];
    el.classList.toggle('done', !!r);
    el.style.background = r ? qColor(r.q) : '';
  });
  hudC.p = -1; hudC.q = -2; hudC.pt = ''; hudC.over = null;
}
function showPane(i) { for (let k = 0; k < 5; k++) $('pane' + k).hidden = k !== i; }
function updateHud() {
  const s = STEPS[G.step]; if (!s) return;
  const p = clamp(s.progress || 0, 0, 1), pt = s.progText || `${Math.round(p * 100)}%`;
  if (Math.abs(p - hudC.p) > 0.001 || pt !== hudC.pt) {
    $('progFill').style.transform = `scaleX(${p.toFixed(4)})`; $('progVal').textContent = pt; hudC.p = p; hudC.pt = pt;
  }
  const over = !!s.progOver;
  if (over !== hudC.over) { $('progFill').classList.toggle('over', over); $('progVal').classList.toggle('over', over); hudC.over = over; }
  const q = s.quality;
  if (q == null) {
    if (hudC.q !== -1) { $('qualFill').style.transform = 'scaleX(0)'; $('qualVal').textContent = '—'; $('qualWord').textContent = ''; hudC.q = -1; }
  } else if (Math.abs(q - hudC.q) > 0.002) {
    const f = $('qualFill');
    f.style.transform = `scaleX(${q.toFixed(4)})`; f.style.background = qColor(q);
    $('qualVal').textContent = `${Math.round(q * 100)}%`; $('qualWord').textContent = gradeWord(q);
    $('qualWord').style.color = qColor(q);
    hudC.q = q;
  }
}
function say(text, dur = 2.4) {
  const b = $('bubble');
  b.textContent = text; b.hidden = false;
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  G.bubbleT = dur;
}
function react(expr, dur = 1.2) { G.exprOverride = expr; G.exprT = dur; }
function currentExpr() {
  if (G.exprT > 0) return G.exprOverride;
  if (G.mode === 'result' && G.final) return G.final.expr;
  const s = STEPS[G.step], q = s && s.quality;
  if (q == null) return 'idle';
  if (q >= 0.92) return 'love';
  if (q >= 0.78) return 'happy';
  if (q >= 0.55) return 'idle';
  if (q >= 0.38) return 'worry';
  return 'shock';
}
function showDone(label, enabled, pulse) {
  const b = $('doneBtn');
  if (b.hidden) b.hidden = false;
  if (b.textContent !== label) b.textContent = label;
  b.disabled = !enabled;
  b.classList.toggle('pulse', !!pulse && enabled);
}
function hideDone() { $('doneBtn').hidden = true; }

function drawAvatar() {
  const c = $('avatar'), S = 56, d = L.dpr;
  if (c.width !== S * d) { c.width = S * d; c.height = S * d; }
  const g = c.getContext('2d');
  g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, S, S);
  const bg = g.createRadialGradient(S * 0.4, S * 0.3, 2, S / 2, S / 2, S * 0.7);
  bg.addColorStop(0, '#fff1d6'); bg.addColorStop(1, '#f6c98c');
  g.fillStyle = bg; g.fillRect(0, 0, S, S);
  drawCustomer(g, G.customer, S / 2, S * 0.5, S * 0.33, currentExpr(), G.t, { splat: G.splatT > 0 });
}

/* ---------------- step flow ---------------- */
function startStep(i) {
  G.step = i; G.mode = 'play'; G.cut = null; G.ghostA = 0;
  STEPS[i].enter();
  setStepHeader(i); showPane(i); hideDone();
  if (i === 3) setPickerTab('sauce');
}
function runCut(cut) { G.mode = 'cut'; G.cut = cut; cut.start(); }
function finishStep(q, info) {
  q = clamp(q, 0, 1);
  G.results[G.step] = { q, info: info || {} };
  G.mode = 'stamp'; G.stampAge = 0; hideDone();
  Sound.ding(); Timers.after(0.16, () => Sound.stamp());
  showStamp(q, stepQuip(G.step, q, info || {}));
  react(q >= 0.88 ? 'love' : q >= 0.72 ? 'happy' : q >= 0.5 ? 'idle' : q >= 0.35 ? 'worry' : 'shock', 1.9);
  const chip = $('chips').children[G.step];
  chip.classList.add('done'); chip.classList.remove('on'); chip.style.background = qColor(q);
  if (q >= 0.95) sparkleBurst(L.W / 2, L.stage.y + L.stage.h * 0.45);
  const i = G.step;
  const next = () => { hideStamp(); afterStep(i); };
  G.stampSkip = next;
  Timers.after(1.75, () => { if (G.stampSkip === next) { G.stampSkip = null; next(); } });
}
function afterStep(i) {
  if (i === 0) { runCut(CutSlide); G.stains = []; }
  else if (i === 1) startStep(2);
  else if (i === 2) runCut(CutCook);
  else if (i === 3) runCut(CutFold);
  else showResults();
}
function showStamp(q, quip) {
  const st = $('stamp');
  $('stampWord').textContent = stampWord(q);
  $('stampPct').textContent = `品質 ${Math.round(q * 100)}%`;
  $('stampQuip').textContent = `「${quip}」`;
  st.style.setProperty('--sc', qColor(q));
  st.style.top = `${Math.round(L.stage.y + L.stage.h * 0.46)}px`;
  st.hidden = false; st.classList.remove('in'); void st.offsetWidth; st.classList.add('in');
}
function hideStamp() { $('stamp').hidden = true; }

/* ---------------- particles ---------------- */
function spawn(p) { G.parts.push(p); if (G.parts.length > 320) G.parts.shift(); }
function sparkleBurst(x, y) {
  if (reduceMotion) return;
  for (let i = 0; i < 18; i++) { const a = rr(0, TAU), sp = rr(120, 320); spawn({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, life: 1, max: 1, rot: rr(0, TAU), size: rr(5, 10) }); }
}
function updateParticles(dt) {
  for (const p of G.parts) {
    p.life -= dt;
    if (p.type === 'splash') {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vz -= 900 * dt; p.z += p.vz * dt;
      if (p.z <= 0 && p.vz < 0) { p.life = 0; landSplash(p); }
    } else if (p.type === 'spark') {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.vx *= 0.98; p.rot += 6 * dt;
    } else {
      p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt;
      if (p.type === 'steam' || p.type === 'smoke') { p.size += dt * 20; p.vx += Math.sin(G.t * 2 + (p.seed || 0)) * 6 * dt; }
      if (p.type === 'drip') { p.vx *= 0.97; p.vy *= 0.97; }
      if (p.type === 'poof') p.size += dt * 30;
    }
  }

}
function landSplash(p) {
  const b = L.bowl;
  if (Math.hypot(p.x - b.x, p.y - b.y) < b.Rb * 0.95) return;
  if (p.y < L.stage.y + 6) {
    if (G.splatT <= 0) { say('噴到我臉上了啦！'); react('shock', 1.6); }
    G.splatT = 4; return;
  }
  G.stains.push({ x: p.x, y: p.y, r: p.r * 1.3, seed: p.seed });
  if (G.stains.length > 40) G.stains.shift();
}
function drawParticles(g) {
  for (const p of G.parts) {
    const k = clamp(p.life / p.max, 0, 1);
    switch (p.type) {
      case 'splash': {
        g.fillStyle = 'rgba(40,20,8,0.22)'; ellipse(g, p.x, p.y, p.r, p.r * 0.7); g.fill();
        const y = p.y - p.z * 0.6;
        g.fillStyle = '#f3e0a8'; circle(g, p.x, y, p.r); g.fill();
        g.fillStyle = 'rgba(255,255,255,0.75)'; circle(g, p.x - p.r * 0.3, y - p.r * 0.3, p.r * 0.35); g.fill();
        break;
      }
      case 'steam': case 'smoke': {
        const a = (k > 0.75 ? (1 - k) / 0.25 : k / 0.75) * (p.type === 'smoke' ? 0.6 : 0.5);
        g.save(); g.globalAlpha = a;
        if (p.type === 'smoke') { g.fillStyle = 'rgba(70,62,58,0.5)'; circle(g, p.x, p.y, p.size * 0.45); g.fill(); }
        else g.drawImage(C.steam, p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        g.restore();
        break;
      }
      case 'drip': {
        g.fillStyle = `rgba(243,224,168,${k.toFixed(3)})`; circle(g, p.x, p.y, p.r); g.fill();
        g.strokeStyle = `rgba(150,110,50,${(k * 0.5).toFixed(3)})`; g.lineWidth = 1; g.stroke();
        break;
      }
      case 'poof': {
        g.fillStyle = `rgba(255,252,240,${(k * 0.7).toFixed(3)})`; circle(g, p.x, p.y, p.size * (1.4 - k * 0.4)); g.fill();
        break;
      }
      case 'spark': {
        g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.globalAlpha = k;
        g.fillStyle = '#ffd75a'; g.strokeStyle = INK; g.lineWidth = 1.2;
        g.beginPath();
        for (let i = 0; i < 10; i++) { const a = i / 10 * TAU, rad = i % 2 ? p.size * 0.42 : p.size; i ? g.lineTo(Math.cos(a) * rad, Math.sin(a) * rad) : g.moveTo(Math.cos(a) * rad, Math.sin(a) * rad); }
        g.closePath(); g.fill(); g.stroke(); g.restore();

      }
    }
  }
}

/* ghost finger that demonstrates the gesture until the player starts */
const ghostTrail = [];
function drawGhost(g) {
  const s = STEPS[G.step];
  if (!s || !s.ghost) return;
  const show = G.mode === 'play' && (!s.started || s.idle > 5);
  G.ghostA = lerp(G.ghostA, show ? 1 : 0, 0.12);
  if (G.ghostA < 0.03) { ghostTrail.length = 0; return; }
  const p = s.ghost(G.t);
  if (!p) return;
  ghostTrail.push({ x: p.x, y: p.y }); if (ghostTrail.length > 14) ghostTrail.shift();
  g.save(); g.globalAlpha = G.ghostA;
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (ghostTrail.length > 2) {
    g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 8;
    g.beginPath(); ghostTrail.forEach((q, i) => i ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y)); g.stroke();
  }
  const pr = p.press ? 0.82 : 1;
  if (p.pulse != null && p.press) { circle(g, p.x, p.y, 18 + (p.pulse % 0.7) * 40); g.strokeStyle = `rgba(255,255,255,${(0.6 * (1 - (p.pulse % 0.7) / 0.7)).toFixed(3)})`; g.lineWidth = 2.5; g.stroke(); }
  g.fillStyle = 'rgba(30,15,8,0.25)'; circle(g, p.x + 3, p.y + 5, 17 * pr); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.55)'; circle(g, p.x, p.y, 17 * pr); g.fill();
  g.strokeStyle = '#fffaf0'; g.lineWidth = 3; g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.95)'; circle(g, p.x, p.y, 7 * pr); g.fill();
  g.restore();
}

/* ---------------- render ---------------- */
function render() {
  const g = ctx;
  g.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  let sx = 0, sy = 0;
  if (G.shake > 0.2 && !reduceMotion) { sx = (Math.random() - 0.5) * G.shake; sy = (Math.random() - 0.5) * G.shake; }
  g.save(); g.translate(sx, sy);
  const front = (G.step === 4 && G.mode !== 'cut') || G.mode === 'result';
  if (front) StepWrap.draw(g);
  else {
    g.drawImage(C.counter, 0, 0, L.W, L.H);
    if (G.mode === 'intro') drawMachine(g);
    else if (G.mode === 'cut' && G.cut) G.cut.draw(g);
    else if (G.step >= 0) STEPS[G.step].draw(g);
  }
  drawParticles(g);
  drawGhost(g);
  g.restore();
  drawLights(g, L.W, 27, G.t);
}

/* ---------------- loop ---------------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  G.t += dt;
  Timers.update(dt);
  if (G.mode === 'play') STEPS[G.step].update(dt);
  else if (G.mode === 'stamp') { G.stampAge += dt; const s = STEPS[G.step]; if (s) s.update(dt); }
  else if (G.mode === 'cut' && G.cut) G.cut.update(dt);
  else if (G.mode === 'result') StepWrap.update(dt);
  if (G.mode === 'intro') {
    G.steamT = (G.steamT || 0) - dt;
    if (G.steamT <= 0 && !reduceMotion) { G.steamT = 0.25; const a = rr(0, TAU), d = Math.sqrt(Math.random()) * 0.7; const [x, y] = n2s(Math.cos(a) * d, Math.sin(a) * d); spawn({ type: 'steam', x, y, vx: rr(-6, 6), vy: rr(-30, -18), life: 2, max: 2, size: L.Rc * rr(0.2, 0.32), seed: Math.random() * 9 }); }
  }
  updateParticles(dt);
  if (G.exprT > 0) G.exprT -= dt;
  if (G.splatT > 0) G.splatT -= dt;
  if (G.shake > 0) G.shake *= Math.exp(-dt * 10);
  if (G.bubbleT > 0) { G.bubbleT -= dt; if (G.bubbleT <= 0) $('bubble').hidden = true; }
  render();
  if (G.mode === 'play' || G.mode === 'stamp' || G.mode === 'cut') { updateHud(); drawAvatar(); }
  if (G.mode === 'intro') drawHero();
  if (G.mode === 'result') drawResultCustomer();
  requestAnimationFrame(frame);
}

/* ---------------- input ---------------- */
let activeId = null;
function ptr(e) { const r = app.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  Sound.init();
  if (G.mode === 'stamp') { if (G.stampAge > 0.45 && G.stampSkip) { const f = G.stampSkip; G.stampSkip = null; f(); } return; }
  if (G.mode !== 'play' || activeId !== null) return;

});

  if (e.pointerId !== activeId || G.mode !== 'play') return;

  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;

const pourBtn = $('pourBtn');

$('doneBtn').addEventListener('click', () => {

/* ---------------- toppings picker ---------------- */
function setPickerTab(tab) {

}

/* ---------------- intro ---------------- */
const demoItems = [
  { type: 'banana', seed: 11 }, { type: 'strawberry', seed: 12 }, { type: 'cream', seed: 13 }, { type: 'banana', seed: 14 },
  { type: 'strawberry', seed: 15 }, { type: 'cream', seed: 16 }, { type: 'sprinkles', seed: 17 }
];
function sizeHero() {
  const c = $('heroCv'), w = Math.min(c.parentElement.clientWidth || 320, 440), h = Math.round(Math.min(w * 0.5, L.H * 0.27));
  c.style.width = `${w}px`; c.style.height = `${h}px`;
  c.width = Math.round(w * L.dpr); c.height = Math.round(h * L.dpr);
  G.hero = { w, h };
}
function drawHero() {
  const c = $('heroCv'); if (!G.hero) sizeHero();
  const { w, h } = G.hero, g = c.getContext('2d');
  g.setTransform(L.dpr, 0, 0, L.dpr, 0, 0); g.clearRect(0, 0, w, h);
  const px = w * 0.3, ph = h * 0.62, pw = ph * 0.62, py = h * 0.3;
  softShadow(g, px, py + ph + 4, pw * 0.7, 8, 0.4);

  const cl = ph * 1.12, bob = Math.sin(G.t * 1.6) * 2;
  drawCrepeCone(g, { x: px, y: py + ph * 0.86 - cl + bob, w: pw * 0.8, len: cl, tex: C.demoTex, items: demoItems, sauces: ['choco'], seed: 3 });
  drawPaperFront(g, px, py, pw, ph, 0, 4);
  if (!reduceMotion) for (let i = 0; i < 3; i++) {
    const k = ((G.t * 0.35 + i / 3) % 1);
    g.save(); g.globalAlpha = Math.sin(k * Math.PI) * 0.55;
    const sz = 30 + k * 30;
    g.drawImage(C.steam, px - sz / 2 + Math.sin(G.t + i * 2) * 8, py - ph * 0.3 - k * h * 0.35 - sz / 2, sz, sz);
    g.restore();
  }

}
function showIntro() {
  G.mode = 'intro'; G.step = -1;
  G.customer = pick(CUSTOMERS);
  $('intro').hidden = false; $('result').hidden = true; $('hud').hidden = true; $('panel').hidden = true;
  hideDone(); hideStamp(); $('bubble').hidden = true;
  $('introSay').textContent = G.customer.hello;
  $('introWho').textContent = G.customer.name;
  const best = G.best;
  $('bestLine').textContent = best ? `最佳紀錄 ${best.score} 分・${best.title}` : '第一次來？做完會有客人的真心評語';
  layout(); sizeHero();
}
function startGame(newCustomer) {
  Sound.init();
  if (newCustomer) { const others = CUSTOMERS.filter(c => c !== G.customer); G.customer = pick(others); }
  $('intro').hidden = true; $('result').hidden = true; $('hud').hidden = false; $('panel').hidden = false;
  G.results = []; G.crepe = { strokes: [], tops: [] }; G.round = { coneFx: rr(0.4, 0.62) }; G.parts = []; G.stains = []; G.final = null;
  StepWrap.prepared = false;

}
$('startBtn').addEventListener('click', () => { Sound.init(); Sound.click(); startGame(false); });
$('againBtn').addEventListener('click', () => { Sound.init(); Sound.click(); startGame(true); });
$('homeBtn').addEventListener('click', () => { Sound.click(); showIntro(); });

/* ---------------- results ---------------- */
function drawResultCustomer() {
  const c = $('resCust'); if (!c.width) return;
  const w = c.clientWidth, h = c.clientHeight, g = c.getContext('2d');
  g.setTransform(L.dpr, 0, 0, L.dpr, 0, 0); g.clearRect(0, 0, w, h);
  drawCustomer(g, G.customer, w / 2, h * 0.42, h * 0.3, currentExpr(), G.t, { splat: G.splatT > 0 });
}
function renderProductShot() {
  const c = $('resCrepe'), w = 104, h = 150;
  c.width = w * L.dpr; c.height = h * L.dpr; c.style.width = `${w}px`; c.style.height = `${h}px`;
  const g = c.getContext('2d'); g.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  const px = w / 2, ph = h * 0.6, pw = ph * 0.64, py = h * 0.36, cl = ph * 1.12;
  softShadow(g, px, py + ph + 2, pw * 0.6, 6, 0.3);
  drawPaperBack(g, px, py, pw, ph);
  const off = clamp((1 - (G.results[4] ? G.results[4].q : 1)) * 0.35, 0, 0.3);
  drawCrepeCone(g, { x: px, y: py + ph * 0.86 - cl, w: pw * 0.8, len: cl, ang: off * (G.round.coneFx > 0.5 ? 1 : -1), tex: G.crepe.topTex || C.demoTex, items: G.crepe.coneItems || [], sauces: G.crepe.coneSauces || [], seed: 5 });

function showResults() {
  G.mode = 'result';
  const qs = G.results.map(r => r.q);
  const score = Math.round(qs.reduce((a, b) => a + b, 0) / qs.length * 100);
  const tier = tierFor(score);
  G.final = { score, tier, expr: tier.expr };
  $('hud').hidden = true; $('panel').hidden = true; hideDone(); $('bubble').hidden = true;
  const res = $('result'); res.hidden = false; res.scrollTop = 0;
  $('resSay').textContent = pick(tier.lines);
  $('resWho').textContent = G.customer.name;
  $('rScore').textContent = score;
  $('rRank').textContent = tier.title;

  G.results.forEach((r, i) => {
    const li = document.createElement('li');
    const name = document.createElement('span'); name.textContent = STEP_INFO[i].title.replace('用 T 型工具', '');
    const dots = document.createElement('i');

    li.append(name, dots, val); list.appendChild(li);
  });

  const memo = [remark, combo].filter(Boolean);

  $('rMemo').hidden = !memo.length;

  $('rOrder').textContent = `內容：${[...sauces, ...tops].join('、') || '（空空如也）'}`;
  const now = new Date(), pad = n => String(n).padStart(2, '0');
  $('rTime').textContent = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  G.orderNo = (G.orderNo || ((Math.random() * 80) | 0) + 12) + 1;
  $('rNo').textContent = `No. ${String(G.orderNo).padStart(4, '0')}`;
  const isBest = !G.best || score > G.best.score;
  if (isBest) { G.best = { score, title: tier.title }; store.set('alee-crepe-best', G.best); }
  $('rBest').textContent = isBest ? '新紀錄！' : `最佳 ${G.best.score}`;
  $('rBest').classList.toggle('new', isBest);
  const rc = $('resCust'); const cw = rc.clientWidth || 120, ch = rc.clientHeight || 120;
  rc.width = cw * L.dpr; rc.height = ch * L.dpr;
  renderProductShot();
  if (score >= 72) { Sound.fanfare(); Timers.after(0.2, () => sparkleBurst(L.W / 2, L.H * 0.3)); }
  else if (score >= 55) Sound.okay();
  else Sound.sad();
}

/* ---------------- sound toggle ---------------- */
function updateSoundBtn() {
  const b = $('soundBtn');
  b.classList.toggle('off', !Sound.on);
  b.setAttribute('aria-pressed', Sound.on ? 'true' : 'false');
  b.setAttribute('aria-label', Sound.on ? '關閉聲音' : '開啟聲音');
}
$('soundBtn').addEventListener('click', () => { Sound.init(); Sound.setOn(!Sound.on); store.set('alee-crepe-sound', Sound.on); updateSoundBtn(); });

/* ---------------- boot ---------------- */
function boot(data) {
  data = data || {};
  G.best = store.get('alee-crepe-best', null) || data.best || null;
  Sound.on = store.get('alee-crepe-sound', true) !== false;
  updateSoundBtn();
  layout();
  showIntro();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); if (G.mode === 'intro') sizeHero(); if (G.mode === 'play' && G.step === 3) setPickerTab(StepFill.tab); });
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(app);

window.__crepe = { G, L, STEPS, startGame, showResults, finishStep };
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ best: G.best })); } catch (e) { /* viewer hook unavailable */ } }
