<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b1118">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>阿麗可麗餅</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="手機版夜市台式脆皮可麗餅製作遊戲：調麵糊、倒麵糊、抹勻、抹醬放料、裝紙筒。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Iansui&family=Lilita+One&display=swap">
<style>
:root {
  /* Layout: one portrait column — striped awning and a lit menu sign up top, the steel counter as the stage, a wooden tool tray under the thumb. */
  --night: #1b1118;
  --awning: #cf3326;
  --awning-cream: #fff3dc;
  --sign: #fffaf0;
  --ink: #3a2216;
  --ink-2: #7c5b45;
  --red: #c9231e;
  --red-deep: #7d1410;
  --bulb: #ffd27a;
  --wood: #b77a44;
  --font-ui: "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --font-hand: "Iansui", "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --font-num: "Lilita One", "Huninn", "Arial Rounded MT Bold", sans-serif;
  --panel-h: 122px;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { height: 100%; box-sizing: border-box; background: var(--night); }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,190,90,0.18) 0 40px, transparent 90px),
    radial-gradient(circle at 88% 30%, rgba(255,96,128,0.16) 0 50px, transparent 110px),
    radial-gradient(circle at 20% 78%, rgba(140,200,255,0.12) 0 60px, transparent 120px),
    radial-gradient(circle at 82% 86%, rgba(255,214,120,0.16) 0 46px, transparent 100px),
    var(--night);
  color: var(--ink); font-family: var(--font-ui); -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
#app {
  position: relative; height: 100%; max-width: 500px; margin: 0 auto; overflow: hidden; overflow: clip;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; background: #a9a59e;
  box-shadow: 0 0 60px rgba(0,0,0,0.6);
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- awning + sound ---------- */
#awning {
  position: absolute; top: 0; left: 0; right: 0; height: 24px; z-index: 21; pointer-events: none;
  background: repeating-linear-gradient(90deg, var(--awning) 0 26px, var(--awning-cream) 26px 52px);
  border-bottom: 2px solid rgba(58,34,22,0.5);
}
#awning::after {
  content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 11px;
  background:
    radial-gradient(circle at 13px 0, var(--awning) 12px, transparent 12.6px) 0 0 / 52px 11px repeat-x,
    radial-gradient(circle at 39px 0, var(--awning-cream) 12px, transparent 12.6px) 0 0 / 52px 11px repeat-x;
  filter: drop-shadow(0 2px 1px rgba(0,0,0,0.25));
}
#soundBtn {
  position: absolute; top: 4px; right: max(8px, env(safe-area-inset-right, 0px)); z-index: 30;
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  background: var(--sign); color: var(--ink); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 rgba(0,0,0,0.3);
}
#soundBtn .mute { display: none; }
#soundBtn.off .wave { display: none; }
#soundBtn.off .mute { display: inline; }
#soundBtn:focus-visible, .btn:focus-visible, .pick:focus-visible, .tabs button:focus-visible, #pourBtn:focus-visible { outline: 3px solid var(--bulb); outline-offset: 3px; }

/* ---------- HUD (lit menu sign) ---------- */
#hud {
  position: absolute; top: 38px; left: 0; right: 0; z-index: 5; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  position: relative; background: var(--sign); border: 2.5px solid var(--ink); border-radius: 16px;
  padding-block: 9px 10px; padding-inline: 11px 12px;
  box-shadow: 0 0 0 4px rgba(255,210,122,0.2), 0 0 26px rgba(255,200,110,0.35), 0 10px 22px rgba(0,0,0,0.38), inset 0 -3px 0 rgba(58,34,22,0.07);
}
.row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: center; }
#avatar { width: 56px; height: 56px; border-radius: 50%; border: 2.5px solid var(--ink); display: block; background: #ffe3bd; }
.eyebrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: var(--font-num); font-size: 12px; letter-spacing: 0.08em; color: var(--red); }
.chips { display: flex; gap: 4px; }
.chips i { width: 16px; height: 7px; border-radius: 4px; background: #eadcc4; box-shadow: inset 0 0 0 1.5px rgba(58,34,22,0.35); transition: background 0.3s; }
.chips i.on { background: var(--red); box-shadow: inset 0 0 0 1.5px var(--red-deep); }
#stepTitle { margin: 1px 0 1px; font-size: 20px; font-weight: 400; line-height: 1.2; text-wrap: balance; }
#stepHint { margin: 0; font-size: 13px; line-height: 1.35; color: var(--ink-2); height: 2.7em; overflow: hidden; }
.meters { display: grid; gap: 5px; margin-top: 7px; }
.meter { display: grid; grid-template-columns: 28px minmax(0, 1fr) 78px; gap: 8px; align-items: center; }
.meter .lab { font-size: 12px; color: var(--ink-2); letter-spacing: 0.06em; }
.bar { height: 11px; border-radius: 6px; background: #efe0c6; box-shadow: inset 0 1px 2px rgba(58,34,22,0.3), 0 0 0 1.5px rgba(58,34,22,0.25); overflow: hidden; }
.bar i { display: block; width: 100%; height: 100%; border-radius: 6px; transform-origin: left center; transform: scaleX(0); background: linear-gradient(180deg, #f7cb6b, #e3972b); transition: transform 0.12s linear, background 0.3s; }
#progFill.over { background: linear-gradient(180deg, #f39a6b, #d9573f); }
.val { display: flex; align-items: baseline; justify-content: flex-end; gap: 5px; white-space: nowrap; }
.val b { font-family: var(--font-num); font-weight: 400; font-size: 17px; font-variant-numeric: tabular-nums; }
#progVal.over { color: #c8442c; }
.val em { font-style: normal; font-size: 12px; }

.bubble {
  position: absolute; top: calc(100% + 8px); left: max(22px, calc(env(safe-area-inset-left, 0px) + 6px)); max-width: 72%;
  background: #fff; color: var(--ink); border: 2.5px solid var(--ink); border-radius: 16px; padding: 7px 12px;
  font-family: var(--font-hand); font-size: 16px; line-height: 1.35; box-shadow: 0 4px 0 rgba(0,0,0,0.22);
}
.bubble::before {
  content: ""; position: absolute; left: 20px; top: -11px; width: 16px; height: 16px; background: #fff;
  border-left: 2.5px solid var(--ink); border-top: 2.5px solid var(--ink); transform: rotate(45deg); border-radius: 3px 0 0 0;
}
.bubble.pop { animation: pop 0.32s cubic-bezier(.2,1.5,.4,1); }
@keyframes pop { from { transform: scale(0.6) translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- buttons ---------- */
.btn {
  border: 2.5px solid var(--ink); border-radius: 999px; cursor: pointer; padding-block: 10px; padding-inline: 20px;
  font-size: 17px; line-height: 1.2; background: var(--sign); color: var(--ink); box-shadow: 0 4px 0 var(--ink);
  transition: transform 0.08s, box-shadow 0.08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--red); color: #fff6e6; text-shadow: 0 1px 0 rgba(0,0,0,0.25); }
.btn.big { font-size: 21px; padding-block: 14px; padding-inline: 34px; width: 100%; max-width: 340px; }
.btn.ghost { background: transparent; color: var(--sign); border-color: rgba(255,250,240,0.7); box-shadow: none; }
.btn:disabled { background: #cbbfae; color: #8b7a68; cursor: default; text-shadow: none; }
.btn.float {
  position: absolute; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--panel-h) + 12px);
  font-size: 17px; padding-block: 10px; padding-inline: 18px;
}
.btn.pulse { animation: nudge 1.1s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

/* ---------- tool tray ---------- */
#panel {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; height: var(--panel-h);
  padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    repeating-linear-gradient(177deg, rgba(90,50,20,0) 0 8px, rgba(90,50,20,0.1) 8px 9px, rgba(255,230,190,0.07) 9px 12px),
    linear-gradient(180deg, #cc955c 0%, #b27742 55%, #996233 100%);
  border-top: 3px solid var(--ink); border-radius: 20px 20px 0 0;
  box-shadow: 0 -6px 18px rgba(0,0,0,0.35), inset 0 3px 0 rgba(255,226,180,0.35);
}
.pane { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.note { margin: 0; text-align: center; font-size: 13px; color: #fff3df; text-shadow: 0 1px 0 rgba(60,30,10,0.5); }
.note.big { font-size: 17px; }
.gauge { position: relative; padding-top: 12px; }
.gauge .track { display: flex; height: 30px; border-radius: 15px; overflow: hidden; border: 2.5px solid var(--ink); box-shadow: inset 0 2px 3px rgba(0,0,0,0.25); }
.gauge .z { display: grid; place-items: center; font-size: 14px; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,0.35); }
.z.slow { width: 18.33%; background: #6c9fd0; }
.z.ok { width: 45%; background: #4d9e57; }
.z.fast { flex: 1; background: #d4553d; }
#needle { position: absolute; top: 0; left: 0; width: 0; height: 100%; transition: left 0.06s linear; }
#needle::before { content: ""; position: absolute; left: -9px; top: -1px; border: 9px solid transparent; border-top: 13px solid var(--sign); filter: drop-shadow(0 2px 0 var(--ink)); }
#needle::after { content: ""; position: absolute; left: -2px; top: 12px; width: 4px; height: 30px; border-radius: 2px; background: var(--sign); box-shadow: 0 0 0 1.5px var(--ink); }
#pourBtn {
  height: 58px; border-radius: 18px; border: 2.5px solid var(--ink); cursor: pointer;
  background: linear-gradient(180deg, #e0463c, var(--red)); color: #fff6e6; font-size: 21px; letter-spacing: 0.06em;
  box-shadow: 0 6px 0 var(--red-deep), 0 8px 14px rgba(0,0,0,0.3); touch-action: none;
  transition: transform 0.06s, box-shadow 0.06s;
}
#pourBtn.on { transform: translateY(5px); box-shadow: 0 1px 0 var(--red-deep), 0 3px 6px rgba(0,0,0,0.3); }
.tabs { display: flex; gap: 6px; align-items: center; }
.tabs button {
  height: 30px; padding-inline: 14px; border-radius: 15px; border: 2px solid rgba(58,34,22,0.8); cursor: pointer;
  background: rgba(255,243,223,0.25); color: #fff3df; font-size: 14px;
}
.tabs button.on { background: var(--sign); color: var(--ink); box-shadow: 0 2px 0 var(--ink); }
.tabs .undo { margin-left: auto; background: rgba(58,34,22,0.35); }
.picks { display: flex; gap: 6px; justify-content: space-between; }
.pick {
  flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer;
  padding-block: 4px 3px; padding-inline: 0; border-radius: 12px; border: 2px solid transparent; background: rgba(255,243,223,0.16);
}
.pick canvas { width: 44px; height: 44px; display: block; }
.pick span { font-size: 11px; color: #fff3df; white-space: nowrap; text-shadow: 0 1px 0 rgba(60,30,10,0.5); }
.pick.sel { background: var(--sign); border-color: var(--ink); box-shadow: 0 3px 0 var(--ink); transform: translateY(-2px); }
.pick.sel span { color: var(--ink); text-shadow: none; }

/* ---------- step stamp ---------- */
#stamp { position: absolute; left: 50%; z-index: 8; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 10px; pointer-events: none; width: min(86%, 340px); }
.seal {
  --sc: #c9231e;
  width: 150px; height: 150px; border-radius: 50%; display: grid; place-content: center; text-align: center; gap: 2px;
  background: rgba(255,250,240,0.93); color: var(--sc); border: 5px solid var(--sc);
  box-shadow: inset 0 0 0 4px rgba(255,250,240,0.93), inset 0 0 0 7px var(--sc), 0 12px 26px rgba(0,0,0,0.4);
  transform: rotate(-9deg);
}
#stamp { --sc: #c9231e; }
#stamp .seal { color: var(--sc); border-color: var(--sc); box-shadow: inset 0 0 0 4px rgba(255,250,240,0.93), inset 0 0 0 7px var(--sc), 0 12px 26px rgba(0,0,0,0.4); }
.seal b { font-weight: 400; font-size: 30px; line-height: 1.1; }
.seal span { font-family: var(--font-num); font-size: 15px; color: var(--ink); }
#stampQuip { margin: 0; background: #fff; border: 2.5px solid var(--ink); border-radius: 14px; padding: 6px 12px; font-family: var(--font-hand); font-size: 16px; text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,0.25); }
#stamp.in .seal { animation: slam 0.42s cubic-bezier(.2,1.4,.45,1) both; }
#stamp.in #stampQuip { animation: pop 0.35s 0.25s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes slam { from { transform: rotate(-24deg) scale(2); opacity: 0; } to { transform: rotate(-9deg) scale(1); opacity: 1; } }

/* ---------- screens ---------- */
.screen {
  position: absolute; inset: 0; z-index: 20; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch;
  padding-block: 46px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#intro { background: linear-gradient(180deg, rgba(21,12,19,0.35) 0%, rgba(21,12,19,0.6) 45%, rgba(21,12,19,0.88) 100%); }
.intro-wrap { max-width: 440px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.signbox {
  width: 100%; text-align: center; background: var(--sign); border: 3px solid var(--ink); border-radius: 18px; padding-block: 10px 12px; padding-inline: 14px;
  box-shadow: 0 0 0 6px rgba(255,210,122,0.18), 0 0 46px rgba(255,200,110,0.5), 0 14px 30px rgba(0,0,0,0.45), inset 0 0 0 4px #fff;
}
.sign-top { margin: 0; font-size: 12px; letter-spacing: 0.22em; color: var(--ink-2); }
.sign { margin: 2px 0 0; display: flex; justify-content: center; gap: 0.03em; font-weight: 400; font-size: clamp(46px, 15vw, 66px); line-height: 1.08; color: var(--red); text-wrap: balance; }
.sign span { display: inline-block; -webkit-text-stroke: 1.6px var(--red-deep); paint-order: stroke fill; text-shadow: 0 3px 0 rgba(125,20,16,0.22); }
.sign span:nth-child(odd) { transform: rotate(-4deg) translateY(2px); }
.sign span:nth-child(even) { transform: rotate(3.5deg); }
.sign-sub { margin: 4px 0 0; font-size: 15px; letter-spacing: 0.12em; color: var(--ink); }
.say {
  position: relative; background: #fff; color: var(--ink); border: 2.5px solid var(--ink); border-radius: 16px; padding-block: 8px; padding-inline: 12px;
  font-family: var(--font-hand); font-size: 16px; line-height: 1.45; box-shadow: 0 4px 0 rgba(0,0,0,0.2);
}
.say .who { display: block; font-family: var(--font-ui); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-2); }
.intro-say { align-self: flex-end; max-width: 78%; margin-top: 4px; }
.intro-say::after {
  content: ""; position: absolute; right: 48px; bottom: -11px; width: 16px; height: 16px; background: #fff;
  border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); transform: rotate(45deg); border-radius: 0 0 3px 0;
}
.hero { width: 100%; display: grid; justify-items: center; margin-top: -6px; }
#heroCv { display: block; max-width: 100%; }
.flow { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.flow li { background: rgba(255,250,240,0.94); border: 2px solid var(--ink); border-radius: 12px; padding-block: 5px 7px; text-align: center; font-size: 12px; line-height: 1.25; white-space: nowrap; }
.flow b { display: block; font-family: var(--font-num); font-weight: 400; font-size: 17px; color: var(--red); }
.best { margin: 0; font-size: 13px; color: #f3e3c8; text-align: center; }

#result { background: rgba(21,12,19,0.74); }
.res-wrap { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.res-head { display: grid; grid-template-columns: 116px minmax(0, 1fr); align-items: center; gap: 6px; }
#resCust { width: 116px; height: 128px; display: block; }
.say.big { font-size: 17px; }
.res-head .say::before {
  content: ""; position: absolute; left: -11px; top: 50%; width: 16px; height: 16px; margin-top: -8px; background: #fff;
  border-left: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); transform: rotate(45deg); border-radius: 0 0 0 3px;
}
.receipt {
  --z: 14px;
  position: relative; background: #fffdf5; color: var(--ink); padding-block: 22px 26px; padding-inline: 18px;
  -webkit-mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / var(--z) 51% repeat-x, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / var(--z) 51% repeat-x;
  mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / var(--z) 51% repeat-x, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / var(--z) 51% repeat-x;
  font-variant-numeric: tabular-nums;
}
.r-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 19px; }
.r-head b { font-weight: 400; color: var(--red); letter-spacing: 0.08em; }
.r-head span, .r-meta { font-family: var(--font-num); font-size: 13px; color: var(--ink-2); }
.r-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 2px; padding-bottom: 10px; border-bottom: 2px dashed rgba(58,34,22,0.3); }
.r-meta span:last-child { font-family: var(--font-ui); font-size: 12px; }
.r-body { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding-block: 10px; border-bottom: 2px dashed rgba(58,34,22,0.3); }
.r-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.r-list li { display: flex; align-items: baseline; gap: 6px; font-size: 15px; }
.r-list li i { flex: 1; min-width: 12px; border-bottom: 2px dotted rgba(58,34,22,0.32); transform: translateY(-4px); }
.r-list li b { font-family: var(--font-num); font-weight: 400; font-size: 18px; min-width: 2em; text-align: right; }
#resCrepe { display: block; }
.r-total { position: relative; display: flex; align-items: baseline; gap: 8px; padding-top: 26px; }
.r-total span { font-size: 16px; }
.r-total b { font-family: var(--font-num); font-weight: 400; font-size: 52px; line-height: 1; color: var(--ink); }
.r-total small { font-family: var(--font-num); font-size: 16px; color: var(--ink-2); }
.r-total em { position: absolute; left: 0; top: 6px; font-style: normal; font-size: 12px; line-height: 1.4; color: var(--ink-2); }
.r-total em.new { color: #fff; background: var(--red); border-radius: 999px; padding: 2px 8px; }
.r-rank {
  --rc: var(--red);
  position: absolute; right: 0; top: 50%; transform: translateY(-40%) rotate(-10deg);
  border: 3px solid var(--rc); color: var(--rc); border-radius: 12px; padding-block: 6px; padding-inline: 10px;
  font-size: 22px; line-height: 1.1; background: rgba(255,253,245,0.85); box-shadow: inset 0 0 0 2px rgba(255,253,245,0.9), inset 0 0 0 4px var(--rc);
  mix-blend-mode: multiply; opacity: 0.92;
}
.r-memo { margin: 10px 0 0; font-family: var(--font-hand); font-size: 16px; line-height: 1.5; }
.r-memo::before { content: "備註："; font-family: var(--font-ui); font-size: 13px; color: var(--ink-2); }
.r-order { margin: 8px 0 0; font-size: 12px; color: var(--ink-2); line-height: 1.5; }
.res-actions { display: grid; justify-items: center; gap: 10px; padding-bottom: 8px; }

@media (max-height: 700px) {
  :root { --panel-h: 108px; }
  #hud { top: 34px; }
  .row { grid-template-columns: 46px minmax(0, 1fr); gap: 8px; }
  #avatar { width: 46px; height: 46px; }
  #stepTitle { font-size: 17px; }
  #stepHint { font-size: 12px; }
  .meters { margin-top: 5px; gap: 3px; }
  .card { padding-block: 7px 8px; }
  .pick canvas { width: 38px; height: 38px; }
  .gauge .track { height: 26px; }
  #pourBtn { height: 50px; }
}
@media (max-height: 640px) {
  .intro-wrap { gap: 8px; justify-content: flex-start; }
  .sign { font-size: clamp(38px, 12vw, 50px); }
  .say { font-size: 15px; padding-block: 6px; }
  .flow li { padding-block: 3px 5px; }
  .btn.big { padding-block: 11px; font-size: 19px; }
}

<script>
'use strict';
/* ============================================================
   阿麗可麗餅 — utilities
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
const sstep = (a, b, v) => { const t = inv(a, b, v); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeIn = t => Math.pow(clamp(t, 0, 1), 3);
const easeInOut = t => { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeBack = t => { t = clamp(t, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const rr = (a, b) => a + (b - a) * Math.random();
const pick = a => a[(Math.random() * a.length) | 0];
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w));
  c.height = Math.max(1, Math.ceil(h));
  return c;
}

const hex = s => { const n = parseInt(s.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

/* smooth value noise + fbm (seeded, deterministic) */
const Noise = (() => {
  const r = mulberry32(1337);
  const p = new Uint8Array(512);
  const base = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = base[i]; base[i] = base[j]; base[j] = t; }
  for (let i = 0; i < 512; i++) p[i] = base[i & 255];
  const vals = new Float32Array(256);
  for (let i = 0; i < 256; i++) vals[i] = r();
  function n2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const X = xi & 255, Y = yi & 255;
    const a = vals[p[X + p[Y]]], b = vals[p[X + 1 + p[Y]]];
    const c = vals[p[X + p[Y + 1]]], d = vals[p[X + 1 + p[Y + 1]]];
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, oct = 4) {
    let s = 0, amp = 0.5, f = 1, n = 0;
    for (let i = 0; i < oct; i++) { s += amp * n2(x * f, y * f); n += amp; amp *= 0.5; f *= 2.03; }
    return s / n;
  }
  return { n2, fbm };
})();

/* path helpers */
function rrect(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function circle(g, x, y, r) { g.beginPath(); g.arc(x, y, Math.max(0.01, r), 0, TAU); }
function ellipse(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, TAU); }

function softShadow(g, x, y, rx, ry, a = 0.3) {
  g.save();
  g.translate(x, y);
  g.scale(Math.max(0.01, rx), Math.max(0.01, ry));
  const grd = g.createRadialGradient(0, 0, 0, 0, 0, 1);
  grd.addColorStop(0, `rgba(38,20,10,${a})`);
  grd.addColorStop(0.55, `rgba(38,20,10,${a * 0.55})`);
  grd.addColorStop(1, 'rgba(38,20,10,0)');
  g.fillStyle = grd;
  circle(g, 0, 0, 1);
  g.fill();
  g.restore();
}

/* tiny game-time scheduler */
const Timers = {
  list: [],
  after(sec, fn) { this.list.push({ t: sec, fn }); },
  update(dt) {
    if (!this.list.length) return;
    const due = [];
    for (const it of this.list) { it.t -= dt; if (it.t <= 0) due.push(it); }
    if (due.length) { this.list = this.list.filter(it => it.t > 0); due.forEach(it => it.fn()); }
  },
  clear() { this.list = []; }
};

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
};

/* ============================================================
   Sound — everything synthesised with WebAudio (no files)
   ============================================================ */
const Sound = {
  ctx: null, master: null, on: true, noise: null, loops: {}, crackleT: 0,

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
    this.master = this.ctx.createGain();
    this.master.gain.value = this.on ? 0.75 : 0;
    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    this.master.connect(comp); comp.connect(this.ctx.destination);
    const len = this.ctx.sampleRate * 2;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
  },

  setOn(v) {
    this.on = v;
    if (this.master) this.master.gain.setTargetAtTime(v ? 0.75 : 0, this.ctx.currentTime, 0.05);
  },

  /* a looping filtered-noise voice whose level is driven every frame */
  loop(name, type, freq, Q) {
    if (!this.ctx) return null;
    if (this.loops[name]) return this.loops[name];
    const src = this.ctx.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = Q;
    const g = this.ctx.createGain(); g.gain.value = 0;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(0, Math.random() * 1.5);
    const self = this;
    const v = {
      f, g, cur: 0,
      set(level, tc = 0.06) { if (Math.abs(level - this.cur) < 0.002) return; this.cur = level; g.gain.setTargetAtTime(level, self.ctx.currentTime, tc); },
      freq(hz) { f.frequency.setTargetAtTime(hz, self.ctx.currentTime, 0.06); }
    };
    this.loops[name] = v;
    return v;
  },
  level(name, v, tc) { const l = this.loops[name]; if (l) l.set(v, tc); },
  silence() { for (const k in this.loops) this.loops[k].set(0, 0.08); },

  tone(freq, dur, o = {}) {
    if (!this.ctx) return;
    const { type = 'sine', vol = 0.3, slide = 0, attack = 0.006, delay = 0 } = o;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator(); osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  },

  burst(dur, o = {}) {
    if (!this.ctx) return;
    const { type = 'bandpass', freq = 1000, Q = 1, vol = 0.3, sweep = 0, delay = 0 } = o;
    const t0 = this.ctx.currentTime + delay;
    const s = this.ctx.createBufferSource(); s.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.Q.value = Q;
    f.frequency.setValueAtTime(freq, t0);
    if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(40, freq * sweep), t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t0, Math.random() * 1.5); s.stop(t0 + dur + 0.03);
  },

  /* sizzle crackle: called each frame with the current sizzle intensity */
  crackle(dt, level) {
    if (!this.ctx || level <= 0.01) return;
    this.crackleT -= dt;
    if (this.crackleT <= 0) {
      this.crackleT = rr(0.02, 0.12) / (0.4 + level);
      this.burst(rr(0.01, 0.035), { type: 'highpass', freq: rr(2500, 6000), vol: 0.05 + 0.12 * level * Math.random() });
    }
  },

  pop() { this.tone(rr(480, 700), 0.13, { vol: 0.22, slide: 0.45 }); this.burst(0.03, { freq: 2600, Q: 0.8, vol: 0.07 }); },
  plop() { this.tone(rr(220, 300), 0.16, { vol: 0.2, slide: 0.5 }); },
  tick() { this.tone(1900, 0.05, { type: 'triangle', vol: 0.05 }); },
  ding() { this.tone(1046.5, 0.9, { vol: 0.16 }); this.tone(1568, 0.7, { vol: 0.07, delay: 0.015 }); this.tone(2093, 0.5, { vol: 0.04, delay: 0.03 }); },
  stamp() { this.tone(120, 0.2, { vol: 0.45, slide: 0.5 }); this.burst(0.07, { type: 'lowpass', freq: 900, vol: 0.25 }); },
  splat() { this.burst(0.14, { type: 'lowpass', freq: 800, Q: 3, vol: 0.28, sweep: 0.45 }); },
  squish() { this.burst(0.16, { type: 'bandpass', freq: 700, Q: 5, vol: 0.18, sweep: 0.5 }); },
  crinkle() { for (let i = 0; i < 6; i++) this.burst(0.035, { type: 'highpass', freq: 2500 + Math.random() * 3500, vol: 0.13, delay: i * 0.028 }); },
  whoosh() { this.burst(0.35, { type: 'bandpass', freq: 500, Q: 0.8, vol: 0.16, sweep: 3 }); },
  slide() { this.burst(0.3, { type: 'bandpass', freq: 1800, Q: 0.6, vol: 0.12, sweep: 0.5 }); },
  click() { this.tone(900, 0.05, { type: 'triangle', vol: 0.08 }); },

  fanfare() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, 0.32, { type: 'triangle', vol: 0.16, delay: i * 0.1 }));
    this.tone(1318.5, 0.7, { type: 'triangle', vol: 0.13, delay: 0.42 });
    this.tone(1046.5, 0.7, { type: 'triangle', vol: 0.09, delay: 0.42 });
  },
  okay() {
    [392, 523.25, 659.25].forEach((f, i) => this.tone(f, 0.3, { type: 'triangle', vol: 0.13, delay: i * 0.12 }));
  },
  sad() {
    if (!this.ctx) return;
    const notes = [[392, 0.34], [370, 0.34], [349.2, 0.34], [329.6, 1.1]];
    let t = 0;
    notes.forEach(([f, d], i) => {
      const t0 = this.ctx.currentTime + t;
      const osc = this.ctx.createOscillator(); osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(f, t0);
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.09, t0 + 0.04);
      g.gain.setValueAtTime(0.09, t0 + d * 0.7);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      if (i === notes.length - 1) {
        const lfo = this.ctx.createOscillator(); lfo.frequency.value = 6;
        const lg = this.ctx.createGain(); lg.gain.value = 7;
        lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t0 + 0.15); lfo.stop(t0 + d);
      }
      osc.connect(lp); lp.connect(g); g.connect(this.master);
      osc.start(t0); osc.stop(t0 + d + 0.05);
      t += d;
    });
  }
};

function buzz(ms = 12) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* not supported */ } }

/* ============================================================
   Art — every prop is painted in code: warm-outlined, softly lit,
   food rendered close to the real thing.
   ============================================================ */
const INK = '#3a2216';
const BATTER = [243, 228, 182];
const BATTER_THICK = [248, 236, 198];
const CREPE_RAMP = [
  [0.00, [247, 226, 168]],
  [0.30, [240, 202, 120]],
  [0.52, [224, 165, 82]],
  [0.70, [196, 128, 56]],
  [0.86, [158, 94, 38]],
  [1.00, [112, 64, 26]]
];
function crepeColor(b) {
  b = clamp(b, 0, 1);
  for (let i = 1; i < CREPE_RAMP.length; i++) {
    if (b <= CREPE_RAMP[i][0]) {
      const [a0, c0] = CREPE_RAMP[i - 1], [a1, c1] = CREPE_RAMP[i];
      return mixc(c0, c1, (b - a0) / (a1 - a0));
    }
  }
  return CREPE_RAMP[CREPE_RAMP.length - 1][1];
}

function steelGrad(g, x0, y0, x1, y1) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  gr.addColorStop(0, '#f6f4f0'); gr.addColorStop(0.3, '#cfcbc4'); gr.addColorStop(0.55, '#96918a');
  gr.addColorStop(0.78, '#dcd8d2'); gr.addColorStop(1, '#a7a29b');
  return gr;
}

/* ---------- counter (top-down) with night street beyond the far edge ---------- */
function paintCounter(g, w, h, edgeY) {
  const ng = g.createLinearGradient(0, 0, 0, edgeY);
  ng.addColorStop(0, '#150c13'); ng.addColorStop(1, '#2d1b25');
  g.fillStyle = ng; g.fillRect(0, 0, w, edgeY + 2);
  const R = mulberry32(11);
  const cols = ['255,190,90', '255,128,80', '255,96,128', '140,200,255', '255,230,150'];
  for (let i = 0; i < 30; i++) {
    const x = R() * w, y = R() * edgeY, r = 6 + R() * 24, c = cols[(R() * cols.length) | 0], a = 0.1 + R() * 0.28;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${c},${a})`); gr.addColorStop(0.7, `rgba(${c},${a * 0.45})`); gr.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = gr; circle(g, x, y, r); g.fill();
  }
  const ch = h - edgeY;
  g.save(); g.translate(0, edgeY);
  const base = g.createLinearGradient(0, 0, w * 0.35, ch);
  base.addColorStop(0, '#cdc9c2'); base.addColorStop(0.5, '#b6b2ab'); base.addColorStop(1, '#9a968f');
  g.fillStyle = base; g.fillRect(0, 0, w, ch);
  for (let i = 0; i < ch * 0.9; i++) {
    const y = R() * ch, a = R() * 0.07;
    g.fillStyle = R() < 0.55 ? `rgba(255,255,255,${a})` : `rgba(60,48,38,${a * 0.75})`;
    g.fillRect(0, y, w, 0.5 + R() * 0.9);
  }
  for (let i = 0; i < 4; i++) {
    const x = R() * w, y = R() * ch * 0.7, r = (0.35 + R() * 0.5) * w;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,212,150,0.22)'); gr.addColorStop(1, 'rgba(255,212,150,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, ch);
  }
  const vg = g.createRadialGradient(w / 2, ch * 0.45, Math.min(w, ch) * 0.3, w / 2, ch * 0.5, Math.max(w, ch) * 0.85);
  vg.addColorStop(0, 'rgba(30,15,10,0)'); vg.addColorStop(1, 'rgba(30,15,10,0.42)');
  g.fillStyle = vg; g.fillRect(0, 0, w, ch);
  const lip = g.createLinearGradient(0, 0, 0, 16);
  lip.addColorStop(0, '#fbf8f3'); lip.addColorStop(0.35, '#cbc7bf'); lip.addColorStop(1, 'rgba(170,165,158,0)');
  g.fillStyle = lip; g.fillRect(0, 0, w, 16);
  g.fillStyle = 'rgba(30,18,12,0.65)'; g.fillRect(0, -2, w, 2);
  g.restore();
}

/* string of warm bulbs under the awning */
function drawLights(g, w, y0, t) {
  const sag = 9, n = Math.max(6, Math.round(w / 40));
  const yAt = x => y0 + sag * (1 - Math.pow((x - w / 2) / (w / 2 + 12), 2));
  g.save();
  g.strokeStyle = 'rgba(20,10,8,0.85)'; g.lineWidth = 1.3;
  g.beginPath();
  for (let x = -12; x <= w + 12; x += 8) { x === -12 ? g.moveTo(x, yAt(x)) : g.lineTo(x, yAt(x)); }
  g.stroke();
  for (let i = 0; i < n; i++) {
    const x = (i + 0.5) * (w / n), y = yAt(x) + 5;
    const fl = 0.85 + 0.15 * Math.sin(t * 3 + i * 1.7) * Math.sin(t * 1.3 + i);
    const gl = g.createRadialGradient(x, y, 0, x, y, 22);
    gl.addColorStop(0, `rgba(255,214,120,${0.55 * fl})`); gl.addColorStop(1, 'rgba(255,214,120,0)');
    g.fillStyle = gl; circle(g, x, y, 22); g.fill();
    g.fillStyle = '#2a1a12'; g.fillRect(x - 2, y - 7, 4, 4);
    const bg = g.createRadialGradient(x - 1, y - 1, 0.5, x, y, 4.5);
    bg.addColorStop(0, '#fffbe8'); bg.addColorStop(0.6, '#ffd36e'); bg.addColorStop(1, '#f19b2c');
    g.fillStyle = bg; ellipse(g, x, y, 3.6, 4.6); g.fill();
  }
  g.restore();
}

/* ---------- crepe machine (top-down) ---------- */
function renderMachine(R, dpr) {
  const half = 1.1 * R, pad = 0.18 * R, S = 2 * (half + pad);
  const c = mkCanvas(S * dpr, S * dpr), g = c.getContext('2d');
  g.scale(dpr, dpr); g.translate(S / 2, S / 2);
  const cr = 0.22 * R;
  g.save();
  g.shadowColor = 'rgba(30,16,8,0.55)'; g.shadowBlur = 0.1 * R * dpr; g.shadowOffsetY = 0.05 * R * dpr;
  rrect(g, -half, -half, 2 * half, 2 * half, cr); g.fillStyle = '#8f8a83'; g.fill();
  g.restore();
  rrect(g, -half, -half, 2 * half, 2 * half, cr); g.fillStyle = steelGrad(g, -half, -half, half, half); g.fill();
  g.save(); rrect(g, -half, -half, 2 * half, 2 * half, cr); g.clip();
  const Rn = mulberry32(5);
  for (let i = 0; i < 220; i++) { g.fillStyle = `rgba(255,255,255,${Rn() * 0.09})`; g.fillRect(-half, -half + Rn() * 2 * half, 2 * half, 0.6); }
  g.restore();
  rrect(g, -half + 2, -half + 2, 2 * half - 4, 2 * half - 4, cr - 2); g.strokeStyle = 'rgba(255,255,255,0.6)'; g.lineWidth = 1.5; g.stroke();
  rrect(g, -half, -half, 2 * half, 2 * half, cr); g.strokeStyle = 'rgba(58,34,22,0.9)'; g.lineWidth = 2; g.stroke();
  /* plate well + plate */
  const rg = g.createRadialGradient(0, 0, R * 0.97, 0, 0, R * 1.07);
  rg.addColorStop(0, '#2c2a28'); rg.addColorStop(1, '#77726c');
  circle(g, 0, 0, R * 1.065); g.fillStyle = rg; g.fill();
  const pg = g.createRadialGradient(-0.3 * R, -0.35 * R, 0.05 * R, 0, 0, R);
  pg.addColorStop(0, '#3f3a36'); pg.addColorStop(0.55, '#272321'); pg.addColorStop(1, '#151312');
  circle(g, 0, 0, R); g.fillStyle = pg; g.fill();
  g.save(); circle(g, 0, 0, R); g.clip();
  const Rn2 = mulberry32(9);
  for (let i = 0; i < 1100; i++) {
    const a = Rn2() * TAU, d = Math.sqrt(Rn2()) * R;
    g.fillStyle = Rn2() < 0.5 ? 'rgba(255,240,220,0.04)' : 'rgba(0,0,0,0.2)';
    g.fillRect(Math.cos(a) * d, Math.sin(a) * d, 1.3, 1.3);
  }
  for (let k = 0; k < 8; k++) { circle(g, 0, 0, R * (0.18 + k * 0.105)); g.strokeStyle = 'rgba(255,226,190,0.028)'; g.lineWidth = R * 0.035; g.stroke(); }
  const sh = g.createLinearGradient(-R, -R, R * 0.5, R * 0.5);
  sh.addColorStop(0, 'rgba(255,236,210,0.16)'); sh.addColorStop(0.5, 'rgba(255,236,210,0.02)'); sh.addColorStop(1, 'rgba(255,236,210,0)');
  g.fillStyle = sh; g.fillRect(-R, -R, 2 * R, 2 * R);
  g.restore();
  circle(g, 0, 0, R); g.strokeStyle = 'rgba(0,0,0,0.65)'; g.lineWidth = 2; g.stroke();
  circle(g, 0, 0, R * 1.065); g.strokeStyle = 'rgba(58,34,22,0.85)'; g.lineWidth = 1.5; g.stroke();
  /* temperature dial (front-right corner) */
  const kx = 0.9 * R, ky = 0.9 * R, kr = 0.105 * R;
  circle(g, kx, ky, kr * 1.55); g.fillStyle = '#f7f3ea'; g.fill(); g.strokeStyle = INK; g.lineWidth = 1.2; g.stroke();
  for (let i = 0; i <= 6; i++) {
    const a = Math.PI * 0.75 + i * (Math.PI * 1.5 / 6);
    g.strokeStyle = i >= 4 ? '#c9231e' : INK; g.lineWidth = 1;
    g.beginPath(); g.moveTo(kx + Math.cos(a) * kr * 1.18, ky + Math.sin(a) * kr * 1.18); g.lineTo(kx + Math.cos(a) * kr * 1.42, ky + Math.sin(a) * kr * 1.42); g.stroke();
  }
  const kg = g.createRadialGradient(kx - kr * 0.3, ky - kr * 0.3, kr * 0.1, kx, ky, kr);
  kg.addColorStop(0, '#5a5550'); kg.addColorStop(1, '#141210');
  circle(g, kx, ky, kr); g.fillStyle = kg; g.fill();
  const pa = Math.PI * 0.75 + 4.4 * (Math.PI * 1.5 / 6);
  g.strokeStyle = '#fff'; g.lineWidth = Math.max(1.2, kr * 0.18); g.lineCap = 'round';
  g.beginPath(); g.moveTo(kx, ky); g.lineTo(kx + Math.cos(pa) * kr * 0.8, ky + Math.sin(pa) * kr * 0.8); g.stroke();
  g.fillStyle = INK; g.font = `${Math.max(7, kr * 0.62)}px "Lilita One", sans-serif`; g.textAlign = 'center';
  g.fillText('200°C', kx, ky + kr * 2.25);
  /* power lamp (front-left) */
  const lx = -0.9 * R, ly = 0.9 * R;
  const lg = g.createRadialGradient(lx, ly, 0, lx, ly, 0.12 * R);
  lg.addColorStop(0, 'rgba(255,150,60,0.75)'); lg.addColorStop(1, 'rgba(255,150,60,0)');
  g.fillStyle = lg; circle(g, lx, ly, 0.12 * R); g.fill();
  circle(g, lx, ly, 0.035 * R); g.fillStyle = '#ffcf70'; g.fill(); g.strokeStyle = INK; g.lineWidth = 1; g.stroke();
  return { canvas: c, size: S };
}

/* ---------- mixing bowl (top-down) ---------- */
function renderBowl(Rb, dpr) {
  const pad = 0.2 * Rb, S = 2 * (Rb + pad);
  const c = mkCanvas(S * dpr, S * dpr), g = c.getContext('2d');
  g.scale(dpr, dpr); g.translate(S / 2, S / 2);
  softShadow(g, Rb * 0.07, Rb * 0.11, Rb * 1.12, Rb * 1.08, 0.5);
  circle(g, 0, 0, Rb); g.fillStyle = steelGrad(g, -Rb, -Rb, Rb, Rb); g.fill();
  const iw = g.createLinearGradient(-Rb, -Rb, Rb, Rb);
  iw.addColorStop(0, '#827d76'); iw.addColorStop(0.45, '#b8b4ad'); iw.addColorStop(1, '#f2efea');
  circle(g, 0, 0, 0.925 * Rb); g.fillStyle = iw; g.fill();
  for (let k = 0; k < 4; k++) { circle(g, 0, 0, Rb * (0.84 + k * 0.02)); g.strokeStyle = `rgba(255,255,255,${0.08 + k * 0.03})`; g.lineWidth = 1; g.stroke(); }
  g.lineCap = 'round';
  g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = Rb * 0.025;
  g.beginPath(); g.arc(0, 0, Rb * 0.965, Math.PI * 1.05, Math.PI * 1.45); g.stroke();
  circle(g, 0, 0, Rb); g.strokeStyle = INK; g.lineWidth = 2; g.stroke();
  circle(g, 0, 0, 0.925 * Rb); g.strokeStyle = 'rgba(58,34,22,0.45)'; g.lineWidth = 1; g.stroke();
  return { canvas: c, size: S };
}

/* unmixed ingredients: milk, flour mound, eggs, butter, sugar */
function renderIngredients(Rs, dpr) {
  const S = 2 * Rs, c = mkCanvas(S * dpr, S * dpr), g = c.getContext('2d');
  g.scale(dpr, dpr); g.translate(Rs, Rs);
  const mg = g.createRadialGradient(-Rs * 0.3, -Rs * 0.3, Rs * 0.1, 0, 0, Rs);
  mg.addColorStop(0, '#fbf7ee'); mg.addColorStop(1, '#ece2cc');
  circle(g, 0, 0, Rs); g.fillStyle = mg; g.fill();
  const R = mulberry32(21);
  /* melted butter pool */
  g.fillStyle = 'rgba(246,206,92,0.55)';
  ellipse(g, -Rs * 0.42, -Rs * 0.38, Rs * 0.2, Rs * 0.15, 0.4); g.fill();
  g.fillStyle = 'rgba(255,240,180,0.6)'; ellipse(g, -Rs * 0.47, -Rs * 0.43, Rs * 0.07, Rs * 0.04, 0.4); g.fill();
  /* flour mound */
  g.save(); g.translate(-Rs * 0.12, Rs * 0.14);
  softShadow(g, Rs * 0.05, Rs * 0.08, Rs * 0.58, Rs * 0.52, 0.22);
  g.beginPath();
  for (let i = 0; i <= 24; i++) {
    const a = i / 24 * TAU, rad = Rs * 0.5 * (0.9 + 0.1 * Math.sin(a * 5 + 1) + 0.04 * Math.sin(a * 11));
    i ? g.lineTo(Math.cos(a) * rad, Math.sin(a) * rad * 0.92) : g.moveTo(Math.cos(a) * rad, Math.sin(a) * rad * 0.92);
  }
  const fg = g.createRadialGradient(-Rs * 0.15, -Rs * 0.18, Rs * 0.05, 0, 0, Rs * 0.52);
  fg.addColorStop(0, '#ffffff'); fg.addColorStop(0.6, '#f7f4ec'); fg.addColorStop(1, '#e3dccd');
  g.fillStyle = fg; g.fill();
  for (let i = 0; i < 180; i++) {
    const a = R() * TAU, d = Math.sqrt(R()) * Rs * 0.48;
    g.fillStyle = R() < 0.5 ? 'rgba(255,255,255,0.8)' : 'rgba(200,190,170,0.35)';
    g.fillRect(Math.cos(a) * d, Math.sin(a) * d, 1.1, 1.1);
  }
  g.restore();
  /* sugar crystals */
  for (let i = 0; i < 26; i++) {
    const x = Rs * (0.15 + R() * 0.3), y = Rs * (0.3 + R() * 0.25);
    g.fillStyle = 'rgba(255,255,255,0.95)'; g.fillRect(x, y, 1.6, 1.6);
    g.fillStyle = 'rgba(180,170,150,0.5)'; g.fillRect(x + 1.2, y + 1.2, 0.8, 0.8);
  }
  /* eggs */
  [[0.36, -0.22, 1], [0.08, -0.5, 0.92]].forEach(([ex, ey, s]) => {
    const x = ex * Rs, y = ey * Rs, wr = Rs * 0.21 * s;
    g.fillStyle = 'rgba(255,255,250,0.55)';
    g.beginPath();
    for (let i = 0; i <= 18; i++) { const a = i / 18 * TAU, rad = wr * (1 + 0.12 * Math.sin(a * 3 + ex * 9)); i ? g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad) : g.moveTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
    g.fill(); g.strokeStyle = 'rgba(220,210,180,0.6)'; g.lineWidth = 1; g.stroke();
    const yr = Rs * 0.1 * s;
    const yg = g.createRadialGradient(x - yr * 0.35, y - yr * 0.35, yr * 0.1, x, y, yr);
    yg.addColorStop(0, '#ffe07a'); yg.addColorStop(0.65, '#f8b42a'); yg.addColorStop(1, '#e39012');
    circle(g, x, y, yr); g.fillStyle = yg; g.fill();
    g.strokeStyle = 'rgba(190,110,10,0.6)'; g.lineWidth = 1; g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.8)'; ellipse(g, x - yr * 0.35, y - yr * 0.4, yr * 0.28, yr * 0.16, -0.5); g.fill();
  });
  return c;
}

function renderMixed(Rs, dpr) {
  const S = 2 * Rs, c = mkCanvas(S * dpr, S * dpr), g = c.getContext('2d');
  g.scale(dpr, dpr); g.translate(Rs, Rs);
  const mg = g.createRadialGradient(-Rs * 0.35, -Rs * 0.35, Rs * 0.05, 0, 0, Rs);
  mg.addColorStop(0, '#fbedc2'); mg.addColorStop(0.6, '#f2dea6'); mg.addColorStop(1, '#e6cb88');
  circle(g, 0, 0, Rs); g.fillStyle = mg; g.fill();
  g.lineCap = 'round';
  for (let k = 0; k < 9; k++) {
    const r = Rs * (0.15 + k * 0.09), a0 = k * 1.3;
    g.strokeStyle = k % 2 ? 'rgba(255,250,230,0.35)' : 'rgba(205,170,95,0.22)';
    g.lineWidth = 1.2 + (k % 3);
    g.beginPath(); g.arc(0, 0, r, a0, a0 + 1.6 + (k % 3) * 0.5); g.stroke();
  }
  return c;
}

/* ---------- tools ---------- */
function drawWhisk(g, x, y, Rb) {
  const ang = 0.82, dx = Math.cos(ang), dy = Math.sin(ang);
  const hl = Rb * 1.5, hb = Rb * 0.3;
  g.save(); g.lineCap = 'round';
  g.strokeStyle = 'rgba(30,18,10,0.22)'; g.lineWidth = Rb * 0.09;
  g.beginPath(); g.moveTo(x + dx * hb + 8, y + dy * hb + 12); g.lineTo(x + dx * hl + 8, y + dy * hl + 12); g.stroke();
  const hx = x + dx * Rb * 0.06, hy = y + dy * Rb * 0.06;
  for (let k = 0; k < 6; k++) {
    const m = Math.abs(Math.cos((k + 0.5) / 6 * Math.PI));
    g.lineWidth = 3; g.strokeStyle = 'rgba(70,64,58,0.85)';
    ellipse(g, hx, hy, Rb * 0.21, Rb * 0.14 * m + Rb * 0.012, ang); g.stroke();
    g.lineWidth = 1.5; g.strokeStyle = k % 2 ? '#e8e5e0' : '#cfcbc5';
    ellipse(g, hx, hy, Rb * 0.21, Rb * 0.14 * m + Rb * 0.012, ang); g.stroke();
  }
  g.strokeStyle = INK; g.lineWidth = Rb * 0.105;
  g.beginPath(); g.moveTo(x + dx * hb, y + dy * hb); g.lineTo(x + dx * hl, y + dy * hl); g.stroke();
  const sg = g.createLinearGradient(x - dy * 6, y + dx * 6, x + dy * 6, y - dx * 6);
  sg.addColorStop(0, '#8d8882'); sg.addColorStop(0.5, '#f4f2ee'); sg.addColorStop(1, '#a29d97');
  g.strokeStyle = sg; g.lineWidth = Rb * 0.075;
  g.beginPath(); g.moveTo(x + dx * hb, y + dy * hb); g.lineTo(x + dx * hl, y + dy * hl); g.stroke();
  g.lineWidth = 2; g.strokeStyle = INK;
  circle(g, x + dx * (hl + Rb * 0.07), y + dy * (hl + Rb * 0.07), Rb * 0.06); g.stroke();
  g.restore();
}

function drawLadle(g, x, y, r, hAng, tilt, fill) {
  g.save(); g.translate(x, y); g.rotate(hAng);
  const sq = 1 - tilt * 0.24;
  softShadow(g, r * 0.3, r * 0.45, r * 1.25, r * 1.1, 0.45);
  g.lineCap = 'round';
  g.strokeStyle = 'rgba(30,18,10,0.25)'; g.lineWidth = r * 0.24;
  g.beginPath(); g.moveTo(r * 0.8 + 6, 10); g.lineTo(r * 4.6 + 6, -r * 0.2 + 10); g.stroke();
  g.strokeStyle = INK; g.lineWidth = r * 0.25;
  g.beginPath(); g.moveTo(r * 0.75, 0); g.quadraticCurveTo(r * 2.6, -r * 0.05, r * 4.6, -r * 0.25); g.stroke();
  const hg = g.createLinearGradient(0, -r * 0.12, 0, r * 0.12);
  hg.addColorStop(0, '#f4f1ec'); hg.addColorStop(0.5, '#bdb8b1'); hg.addColorStop(1, '#8a857f');
  g.strokeStyle = hg; g.lineWidth = r * 0.17;
  g.beginPath(); g.moveTo(r * 0.75, 0); g.quadraticCurveTo(r * 2.6, -r * 0.05, r * 4.6, -r * 0.25); g.stroke();
  g.save(); g.scale(sq, 1);
  circle(g, 0, 0, r); g.fillStyle = steelGrad(g, -r, -r, r, r); g.fill();
  g.strokeStyle = INK; g.lineWidth = 2; g.stroke();
  const ig = g.createLinearGradient(-r, -r, r, r);
  ig.addColorStop(0, '#7b766f'); ig.addColorStop(1, '#e7e3dd');
  circle(g, 0, 0, r * 0.86); g.fillStyle = ig; g.fill();
  if (fill > 0.01) {
    const fr = r * 0.84 * Math.sqrt(clamp(fill, 0, 1));
    const bx = -tilt * r * 0.3;
    const bg = g.createRadialGradient(bx - fr * 0.3, -fr * 0.3, fr * 0.05, bx, 0, fr);
    bg.addColorStop(0, '#fff3cf'); bg.addColorStop(1, '#ead193');
    circle(g, bx, 0, fr); g.fillStyle = bg; g.fill();
    g.fillStyle = 'rgba(255,255,255,0.5)'; ellipse(g, bx - fr * 0.35, -fr * 0.4, fr * 0.3, fr * 0.13, -0.5); g.fill();
  }
  g.restore();
  g.restore();
}

/* T-shaped wooden spreader. ang = bar direction; handle trails along local +y. */
function drawTTool(g, x, y, ang, len, w, load) {
  g.save(); g.translate(x, y); g.rotate(ang);
  g.fillStyle = 'rgba(10,6,4,0.35)';
  rrect(g, -len / 2 + 5, -w / 2 + 8, len, w, w / 2); g.fill();
  rrect(g, -w * 0.2 + 7, w * 0.3 + 10, w * 0.4, len * 0.34, w * 0.2); g.fill();
  if (load > 0.002) {
    const bead = clamp(Math.sqrt(load) * w * 1.4, w * 0.15, w * 0.95);
    const bg = g.createLinearGradient(0, -w / 2 - bead, 0, -w / 2);
    bg.addColorStop(0, '#fff6da'); bg.addColorStop(1, '#e9cf8e');
    rrect(g, -len * 0.44, -w / 2 - bead * 0.85, len * 0.88, bead, bead / 2); g.fillStyle = bg; g.fill();
    g.fillStyle = 'rgba(255,255,255,0.55)'; rrect(g, -len * 0.36, -w / 2 - bead * 0.72, len * 0.5, bead * 0.22, bead * 0.11); g.fill();
  }
  const hg = g.createLinearGradient(-w * 0.2, 0, w * 0.2, 0);
  hg.addColorStop(0, '#9b6532'); hg.addColorStop(0.45, '#e2b479'); hg.addColorStop(1, '#a56c37');
  rrect(g, -w * 0.18, w * 0.25, w * 0.36, len * 0.34, w * 0.18); g.fillStyle = hg; g.fill();
  g.strokeStyle = INK; g.lineWidth = 1.6; g.stroke();
  circle(g, 0, w * 0.25 + len * 0.34, w * 0.3);
  const kg = g.createRadialGradient(-w * 0.1, w * 0.25 + len * 0.34 - w * 0.1, 1, 0, w * 0.25 + len * 0.34, w * 0.3);
  kg.addColorStop(0, '#f0c98f'); kg.addColorStop(1, '#a96f39'); g.fillStyle = kg; g.fill(); g.stroke();
  const bgw = g.createLinearGradient(0, -w / 2, 0, w / 2);
  bgw.addColorStop(0, '#f3cf97'); bgw.addColorStop(0.5, '#d6a466'); bgw.addColorStop(1, '#a97039');
  rrect(g, -len / 2, -w / 2, len, w, w / 2); g.fillStyle = bgw; g.fill();
  g.save(); rrect(g, -len / 2, -w / 2, len, w, w / 2); g.clip();
  g.strokeStyle = 'rgba(120,70,30,0.35)'; g.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const yy = -w / 2 + (i + 0.5) * w / 4;
    g.beginPath(); g.moveTo(-len / 2, yy);
    g.bezierCurveTo(-len * 0.2, yy + w * 0.12 * Math.sin(i), len * 0.15, yy - w * 0.1, len / 2, yy + w * 0.06);
    g.stroke();
  }
  g.restore();
  rrect(g, -len / 2, -w / 2, len, w, w / 2); g.strokeStyle = INK; g.lineWidth = 2; g.stroke();
  g.restore();
}

function blobPath(g, s, R, n = 10, j = 0.18, sy = 1) {
  g.beginPath();
  const ph = R() * TAU;
  for (let i = 0; i <= n; i++) {
    const a = i / n * TAU, rad = s * (1 - j / 2 + j * (0.5 + 0.5 * Math.sin(a * 3 + ph)) * (0.7 + R() * 0.3));
    const x = Math.cos(a) * rad, y = Math.sin(a) * rad * sy;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
}

/* sprite = topping painted once into its own small canvas */
function makeToppingSprite(type, s, seed, dpr) {
  const pad = s * 1.45, S = pad * 2;
  const c = mkCanvas(S * dpr, S * dpr), g = c.getContext('2d');
  g.scale(dpr, dpr); g.translate(pad, pad);
  TOP_DRAW[type](g, s, mulberry32(seed | 0));
  return { canvas: c, half: pad };
}

/* ---------- sauces ---------- */
const SAUCE = {
  choco: { name: '巧克力醬', body: '#4b2412', edge: '#2b1208', hi: 'rgba(255,214,190,0.55)', cap: '#7b3a1c', w: 0.085, kind: 'sweet' },
  peanut: { name: '花生醬', body: '#bb7c3d', edge: '#87521f', hi: 'rgba(255,236,205,0.35)', cap: '#e0a84d', w: 0.09, bits: '#7f4b1d', kind: 'sweet' },
  jam: { name: '草莓醬', body: '#c41d38', edge: '#860b20', hi: 'rgba(255,195,205,0.65)', cap: '#ec4553', w: 0.08, seeds: true, kind: 'sweet' },
  condensed: { name: '煉乳', body: '#f6ebcf', edge: '#d6c294', hi: 'rgba(255,255,255,0.85)', cap: '#3c79c4', w: 0.065, kind: 'sweet' },
  mayo: { name: '沙拉醬', body: '#fff7da', edge: '#dcc58c', hi: 'rgba(255,255,255,0.95)', cap: '#e84e3c', w: 0.07, ridged: true, kind: 'savory' }
};
const SAUCE_KEYS = ['choco', 'peanut', 'jam', 'condensed', 'mayo'];

function drawSauceStrokes(g, strokes, cx, cy, Rc) {
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (const st of strokes) {
    const S = SAUCE[st.type], pts = st.pts;
    if (!pts.length) continue;
    const w = S.w * Rc;
    const path = (ox = 0, oy = 0) => {
      g.beginPath();
      g.moveTo(cx + pts[0][0] * Rc + ox, cy + pts[0][1] * Rc + oy);
      if (pts.length === 1) g.lineTo(cx + pts[0][0] * Rc + ox + 0.5, cy + pts[0][1] * Rc + oy + 0.3);
      for (let i = 1; i < pts.length; i++) g.lineTo(cx + pts[i][0] * Rc + ox, cy + pts[i][1] * Rc + oy);
    };
    path(w * 0.1, w * 0.18); g.strokeStyle = 'rgba(50,24,8,0.3)'; g.lineWidth = w * 1.05; g.stroke();
    path(); g.strokeStyle = S.edge; g.lineWidth = w; g.stroke();
    path(); g.strokeStyle = S.body; g.lineWidth = w * 0.76; g.stroke();
    if (S.ridged) { path(); g.strokeStyle = 'rgba(205,175,105,0.5)'; g.lineWidth = w * 0.1; g.stroke(); }
    path(-w * 0.14, -w * 0.17); g.strokeStyle = S.hi; g.lineWidth = w * 0.18; g.stroke();
    if (S.bits || S.seeds) {
      g.fillStyle = S.bits || '#ffd28a';
      for (let i = 0; i < pts.length; i += 2) {
        const k = (i * 7919) % 13;
        const x = cx + pts[i][0] * Rc + (k - 6) * w * 0.045, y = cy + pts[i][1] * Rc + ((k * 3) % 11 - 5) * w * 0.045;
        circle(g, x, y, w * (S.seeds ? 0.05 : 0.07)); g.fill();
      }
    }
  }
}

/* ---------- picker icons ---------- */
function drawBottleIcon(g, key, w, h) {
  const S = SAUCE[key];
  g.save(); g.translate(w / 2, h / 2);
  const bw = w * 0.42, bh = h * 0.56, top = -h * 0.2;
  softShadow(g, 2, bh * 0.75, bw * 0.7, h * 0.08, 0.35);
  /* nozzle + cap */
  g.fillStyle = S.cap; g.strokeStyle = INK; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(-bw * 0.16, top - h * 0.06); g.lineTo(-bw * 0.05, top - h * 0.24); g.lineTo(bw * 0.05, top - h * 0.24); g.lineTo(bw * 0.16, top - h * 0.06); g.closePath(); g.fill(); g.stroke();
  rrect(g, -bw * 0.34, top - h * 0.08, bw * 0.68, h * 0.1, 3); g.fill(); g.stroke();
  /* body */
  rrect(g, -bw / 2, top, bw, bh, bw * 0.28);
  const bg = g.createLinearGradient(-bw / 2, 0, bw / 2, 0);
  bg.addColorStop(0, S.edge); bg.addColorStop(0.35, S.body); bg.addColorStop(1, S.edge);
  g.fillStyle = bg; g.fill(); g.stroke();
  rrect(g, -bw / 2 + 2, top + bh * 0.42, bw - 4, bh * 0.3, 2); g.fillStyle = 'rgba(255,250,238,0.92)'; g.fill();
  g.fillStyle = S.cap; circle(g, 0, top + bh * 0.57, bw * 0.12); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.5)'; rrect(g, -bw * 0.32, top + bh * 0.08, bw * 0.12, bh * 0.28, 3); g.fill();
  g.restore();
}

function drawBinIcon(g, key, w, h, dpr) {

/* ---------- steam ---------- */
function makeSteamSprite(dpr) {
  const S = 64, c = mkCanvas(S * dpr, S * dpr), g = c.getContext('2d');

/* ---------- front view (hand-off) ---------- */
function paintNight(g, w, h, top, counterY) {
  const bg = g.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#150c13'); bg.addColorStop(0.55, '#2b1925'); bg.addColorStop(1, '#3b2531');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  const R = mulberry32(42);
  const signs = ['255,80,80', '255,200,90', '120,220,255', '255,140,210'];
  for (let i = 0; i < 6; i++) {
    const x = R() * w, y = top + R() * (counterY - top) * 0.55, sw = 40 + R() * 70, sh = 14 + R() * 18, c = signs[i % signs.length];
    const gr = g.createRadialGradient(x, y, 2, x, y, sw);
    gr.addColorStop(0, `rgba(${c},0.28)`); gr.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = gr; g.fillRect(x - sw, y - sw, sw * 2, sw * 2);
    g.fillStyle = `rgba(${c},0.22)`; rrect(g, x - sw / 2, y - sh / 2, sw, sh, 4); g.fill();
  }
  const cols = ['255,190,90', '255,128,80', '255,96,128', '140,200,255', '255,230,150'];
  for (let i = 0; i < 46; i++) {
    const x = R() * w, y = R() * counterY, r = 5 + R() * 26, c = cols[(R() * cols.length) | 0], a = 0.08 + R() * 0.26;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${c},${a})`); gr.addColorStop(0.7, `rgba(${c},${a * 0.5})`); gr.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = gr; circle(g, x, y, r); g.fill();
  }
  /* counter top seen from the front */
  const cg = g.createLinearGradient(0, counterY, 0, h);
  cg.addColorStop(0, '#f2efe9'); cg.addColorStop(0.06, '#c6c2bb'); cg.addColorStop(0.5, '#a9a59e'); cg.addColorStop(1, '#8a867f');
  g.fillStyle = cg; g.fillRect(0, counterY, w, h - counterY);
  for (let i = 0; i < 120; i++) { g.fillStyle = `rgba(255,255,255,${R() * 0.07})`; g.fillRect(0, counterY + R() * (h - counterY), w, 0.6); }
  g.fillStyle = 'rgba(30,18,12,0.7)'; g.fillRect(0, counterY - 1.5, w, 1.5);
  const glow = g.createLinearGradient(0, counterY, 0, counterY + 40);
  glow.addColorStop(0, 'rgba(255,214,150,0.25)'); glow.addColorStop(1, 'rgba(255,214,150,0)');
  g.fillStyle = glow; g.fillRect(0, counterY, w, 40);
}

/* paper sleeve. (x,y) = centre of the front mouth, w = mouth width, h = height to tip */
function drawPaperBack(g, x, y, w, h) {
  const hw = w / 2;
  g.beginPath();
  g.moveTo(x - hw, y);
  g.lineTo(x - hw * 0.97, y - h * 0.13);
  g.quadraticCurveTo(x, y - h * 0.2, x + hw * 0.97, y - h * 0.13);
  g.lineTo(x + hw, y); g.lineTo(x, y + h); g.closePath();
  const pg = g.createLinearGradient(x - hw, 0, x + hw, 0);
  pg.addColorStop(0, '#e2d6c1'); pg.addColorStop(0.5, '#f1e8d8'); pg.addColorStop(1, '#d6c8b0');
  g.fillStyle = pg; g.fill();
  g.strokeStyle = INK; g.lineWidth = 2; g.lineJoin = 'round'; g.stroke();
  g.fillStyle = 'rgba(80,50,20,0.12)';
  g.beginPath(); g.moveTo(x - hw, y); g.lineTo(x + hw, y); g.lineTo(x, y + h * 0.5); g.closePath(); g.fill();
}

function drawPaperFront(g, x, y, w, h, crumple, seed) {
  const hw = w / 2, R = mulberry32(seed | 0);
  const pts = [];
  const n = 10;
  for (let i = 0; i <= n; i++) {
    const f = i / n, px = x - hw + f * w;
    const notch = h * 0.07 * (1 - Math.abs(f - 0.5) * 2);
    const cr = crumple * h * 0.035 * (R() - 0.3) * (i === 0 || i === n ? 0 : 1);
    pts.push([px, y + notch + cr]);
  }
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.lineTo(x, y + h); g.closePath();
  const pg = g.createLinearGradient(x - hw, 0, x + hw, 0);
  pg.addColorStop(0, '#efe7d8'); pg.addColorStop(0.47, '#fffdf7'); pg.addColorStop(0.53, '#f6efe2'); pg.addColorStop(1, '#e3d9c6');
  g.fillStyle = pg; g.fill();
  g.save(); g.clip();
  /* printed band + logo */
  const by = y + h * 0.17;
  g.fillStyle = '#c9231e'; g.fillRect(x - hw, by, w, h * 0.1);
  g.fillStyle = '#fff3dc';
  g.font = `${Math.max(9, h * 0.062)}px "Huninn", "PingFang TC", "Noto Sans TC", sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('阿麗可麗餅', x, by + h * 0.052);
  g.strokeStyle = 'rgba(201,35,30,0.55)'; g.lineWidth = 1.2;
  for (let i = -8; i < 14; i++) {
    const sx = x - hw + i * w * 0.09;
    g.beginPath(); g.moveTo(sx, by + h * 0.12); g.lineTo(sx + h * 0.9, by + h * 0.12 + h * 0.9); g.stroke();
  }
  g.fillStyle = 'rgba(201,35,30,0.9)';
  circle(g, x, y + h * 0.48, h * 0.075); g.fill();
  g.fillStyle = '#fff3dc'; g.font = `${Math.max(8, h * 0.06)}px "Huninn", "PingFang TC", sans-serif`;
  g.fillText('麗', x, y + h * 0.485);
  g.fillStyle = 'rgba(0,0,0,0.06)'; g.fillRect(x - 0.5, y, 1, h);
  if (crumple > 0.05) {
    g.strokeStyle = `rgba(90,60,30,${Math.min(0.45, crumple * 0.3)})`; g.lineWidth = 1;
    const R2 = mulberry32((seed | 0) + 77);
    for (let i = 0; i < Math.min(9, crumple * 6); i++) {
      const sx = x - hw * 0.8 + R2() * w * 0.8, sy = y + R2() * h * 0.25;
      g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + (R2() - 0.5) * 18, sy + 8 + R2() * 16); g.lineTo(sx + (R2() - 0.5) * 22, sy + 20 + R2() * 18); g.stroke();
    }
  }
  g.restore();
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.lineTo(x, y + h); g.closePath();
  g.strokeStyle = INK; g.lineWidth = 2; g.lineJoin = 'round'; g.stroke();
}

function drawRack(g, x, y, w, h, counterY, part) {
  const ringY = y + h * 0.42, ringW = w * 0.62, ringH = w * 0.1;
  g.save(); g.lineCap = 'round';
  if (part === 'back') {
    g.strokeStyle = INK; g.lineWidth = 5;
    g.beginPath(); g.moveTo(x - ringW, ringY); g.lineTo(x - ringW * 1.12, counterY + 6); g.moveTo(x + ringW, ringY); g.lineTo(x + ringW * 1.12, counterY + 6); g.stroke();
    g.strokeStyle = '#c9c5be'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(x - ringW, ringY); g.lineTo(x - ringW * 1.12, counterY + 6); g.moveTo(x + ringW, ringY); g.lineTo(x + ringW * 1.12, counterY + 6); g.stroke();
    g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.ellipse(x, ringY, ringW, ringH, 0, Math.PI, TAU); g.stroke();
    g.strokeStyle = '#d9d5cf'; g.lineWidth = 3; g.beginPath(); g.ellipse(x, ringY, ringW, ringH, 0, Math.PI, TAU); g.stroke();
    softShadow(g, x, counterY + 10, ringW * 1.4, 8, 0.35);
  } else {
    g.strokeStyle = INK; g.lineWidth = 5.5; g.beginPath(); g.ellipse(x, ringY, ringW, ringH, 0, 0, Math.PI); g.stroke();
    const sg = g.createLinearGradient(x - ringW, 0, x + ringW, 0);
    sg.addColorStop(0, '#9e9993'); sg.addColorStop(0.4, '#f7f5f1'); sg.addColorStop(1, '#a9a49d');
    g.strokeStyle = sg; g.lineWidth = 3.5; g.beginPath(); g.ellipse(x, ringY, ringW, ringH, 0, 0, Math.PI); g.stroke();
  }
  g.restore();
}

/* rolled crepe cone hanging from (x,y) = rim centre, rotated by ang */
function drawCrepeCone(g, o) {
  const hw = o.w / 2, rimH = o.w * 0.17, len = o.len;
  g.save(); g.translate(o.x, o.y); g.rotate(o.ang || 0);
  if (o.scale) g.scale(o.scale, o.scale);
  /* opening */
  ellipse(g, 0, 0, hw, rimH);
  const ig = g.createLinearGradient(0, -rimH, 0, rimH);
  ig.addColorStop(0, '#6b3d18'); ig.addColorStop(1, '#a8682e');
  g.fillStyle = ig; g.fill();
  g.strokeStyle = '#8c5222'; g.lineWidth = 2.5; g.beginPath(); g.ellipse(0, 0, hw, rimH, 0, Math.PI, TAU); g.stroke();
  /* fillings sticking out */
  if (o.items && o.items.length) drawConeFillings(g, o.items, hw, rimH, o.seed || 1, o.sauces || []);
  else if (o.sauces && o.sauces.length) drawConeSauceOnly(g, o.sauces, hw, rimH);
  /* body */
  const body = () => {
    g.beginPath();
    g.moveTo(-hw, 0);
    g.bezierCurveTo(-hw * 0.96, len * 0.36, -hw * 0.34, len * 0.82, 0, len);
    g.bezierCurveTo(hw * 0.34, len * 0.82, hw * 0.96, len * 0.36, hw, 0);
    g.ellipse(0, 0, hw, rimH, 0, 0, Math.PI, false);
    g.closePath();
  };
  body();
  g.save(); g.clip();
  if (o.tex) {
    const ts = len * 1.25;
    g.drawImage(o.tex, -ts / 2, -len * 0.12, ts, ts);
  } else { g.fillStyle = '#e5ad5e'; g.fillRect(-hw, -rimH, o.w, len + rimH); }
  const sh = g.createLinearGradient(-hw, 0, hw, 0);
  sh.addColorStop(0, 'rgba(70,32,6,0.5)'); sh.addColorStop(0.28, 'rgba(255,236,200,0.18)'); sh.addColorStop(0.5, 'rgba(255,236,200,0.06)');
  sh.addColorStop(0.8, 'rgba(70,32,6,0.22)'); sh.addColorStop(1, 'rgba(60,26,4,0.55)');
  g.fillStyle = sh; g.fillRect(-hw, -rimH, o.w, len + rimH * 2);
  const vg = g.createLinearGradient(0, 0, 0, len);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(60,26,4,0.35)');
  g.fillStyle = vg; g.fillRect(-hw, 0, o.w, len);
  /* rolled seam */
  g.lineCap = 'round';
  g.strokeStyle = 'rgba(70,32,8,0.55)'; g.lineWidth = 3.5;
  g.beginPath(); g.moveTo(-hw * 0.5, rimH * 0.9); g.bezierCurveTo(-hw * 0.2, len * 0.35, hw * 0.25, len * 0.55, hw * 0.12, len * 0.93); g.stroke();
  g.strokeStyle = 'rgba(255,228,170,0.55)'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(-hw * 0.5 - 2, rimH * 0.9 - 1); g.bezierCurveTo(-hw * 0.2 - 2, len * 0.35, hw * 0.25 - 2, len * 0.55, hw * 0.12 - 2, len * 0.93); g.stroke();
  g.restore();
  body(); g.strokeStyle = '#5a3110'; g.lineWidth = 2; g.lineJoin = 'round'; g.stroke();
  g.strokeStyle = '#a05f25'; g.lineWidth = 3;
  g.beginPath(); g.ellipse(0, 0, hw, rimH, 0, 0.05, Math.PI - 0.05); g.stroke();
  g.strokeStyle = 'rgba(255,225,160,0.7)'; g.lineWidth = 1.2;
  g.beginPath(); g.ellipse(0, -1.5, hw * 0.97, rimH * 0.9, 0, 0.3, Math.PI - 0.3); g.stroke();
  g.restore();
}

function drawConeFillings(g, items, hw, rimH, seed, sauces) {
  const R = mulberry32(seed);
  const list = items.slice(0, 11);
  const n = list.length;
  const placed = list.map((it, i) => {
    const f = n === 1 ? 0.5 : i / (n - 1);
    const back = i % 2 === 0;
    return {
      it, back,
      x: (f - 0.5) * hw * 1.45 + (R() - 0.5) * hw * 0.15,
      y: (back ? -rimH * 0.95 : -rimH * 0.2) - R() * rimH * 0.5,
      rot: (R() - 0.5) * 0.9
    };
  });
  placed.sort((a, b) => a.y - b.y);
  for (const p of placed) {
    const sz = TOP[p.it.type].size;
    const s = hw * 0.36 * (sz / 0.09);
    g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.scale(1, 0.82);
    TOP_DRAW[p.it.type](g, s, mulberry32(p.it.seed | 0));
    g.restore();
  }
  if (sauces.length) {
    g.lineCap = 'round'; g.lineJoin = 'round';
    sauces.slice(0, 2).forEach((k, j) => {
      const S = SAUCE[k];
      const wave = (ox, oy) => {
        g.beginPath();
        for (let i = 0; i <= 24; i++) {
          const f = i / 24, x = -hw * 0.72 + f * hw * 1.44;
          const y = -rimH * (1.05 + j * 0.35) + Math.sin(f * Math.PI * 3 + j * 1.3) * rimH * 0.45 + ox * 0 + oy;
          i ? g.lineTo(x + ox, y) : g.moveTo(x + ox, y);
        }
      };
      g.strokeStyle = S.edge; g.lineWidth = hw * 0.075; wave(0, 0); g.stroke();
      g.strokeStyle = S.body; g.lineWidth = hw * 0.05; wave(0, 0); g.stroke();
      g.strokeStyle = S.hi; g.lineWidth = hw * 0.016; wave(-1, -1.2); g.stroke();
    });
  }
}

function drawConeSauceOnly(g, sauces, hw, rimH) {
  const S = SAUCE[sauces[0]];
  ellipse(g, 0, -rimH * 0.1, hw * 0.85, rimH * 0.7);
  g.fillStyle = S.body; g.fill();
  g.fillStyle = S.hi; ellipse(g, -hw * 0.3, -rimH * 0.35, hw * 0.25, rimH * 0.18); g.fill();
}

function drawTongs(g, x, y, open) {
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  const spread = 6 + open * 16;
  const arm = (dir) => {
    g.beginPath();
    g.moveTo(x + dir * spread, y + 4);
    g.lineTo(x + dir * (spread + 3), y - 30);
    g.lineTo(x + 26 + dir * 6, y - 190);
  };
  [-1, 1].forEach(d => {
    arm(d); g.strokeStyle = INK; g.lineWidth = 7.5; g.stroke();
    arm(d); g.strokeStyle = d < 0 ? '#e9e6e1' : '#bdb8b1'; g.lineWidth = 4.5; g.stroke();
  });
  [-1, 1].forEach(d => {
    rrect(g, x + d * spread - 4, y - 3, 8, 12, 3);
    g.fillStyle = '#d24b3a'; g.fill(); g.strokeStyle = INK; g.lineWidth = 1.5; g.stroke();
  });
  g.restore();
}

/* cooked crepe texture from a thickness sampler (u,v in -1..1).
   Built as a job so it can be spread over several frames. */
function crepeTexJob(size, sampleH, marksAt, opts = {}) {
  const S = Math.max(16, Math.round(size));
  const c = mkCanvas(S, S), g = c.getContext('2d');
  const img = g.createImageData(S, S), d = img.data;
  const under = !!opts.under, lump = opts.lump || 0, seedOff = under ? 17.3 : 0;
  const rnd = mulberry32(under ? 99 : 7);
  let py = 0;
  const job = {
    canvas: c, done: false,
    step(budgetMs) {
      const t0 = performance.now();
      while (py < S) {
        const v = (py + 0.5) / S * 2 - 1;
        for (let px = 0; px < S; px++) {
          const u = (px + 0.5) / S * 2 - 1;
          const r2 = u * u + v * v, idx = (py * S + px) * 4;
          if (r2 > 1) { d[idx + 3] = 0; continue; }
          const r = Math.sqrt(r2);
          const h = sampleH(u, v);
          const ang = Math.atan2(v, u);
          const edgeR = 0.975 + 0.018 * Noise.n2(ang * 5 + 3, 1.7) + 0.012 * Noise.n2(ang * 19, 4.1);
          let a = sstep(edgeR, edgeR - 0.03, r);
          const lacy = Noise.n2(u * 24 + seedOff, v * 24);
          a *= sstep(0.12, 0.36, h + (lacy - 0.5) * 0.35);
          if (a <= 0.01) { d[idx + 3] = 0; continue; }
          let b = under ? 0.5 : 0.36;
          b += 0.32 * (1 - clamp(h, 0, 1.7) / 1.7);
          b += 0.26 * (Noise.fbm(u * 3.2 + seedOff, v * 3.2, 3) - 0.5);
          b += (under ? 0.26 : 0.2) * sstep(0.56, 0.74, Noise.fbm(u * 8 + 5 + seedOff, v * 8, 3));
          const pore = Noise.n2(u * 72 + seedOff, v * 72 + 3);
          b += 0.16 * sstep(0.76, 0.9, pore) - 0.08 * sstep(0.2, 0.08, pore);
          b += 0.05 * (Noise.n2(u * 140, v * 140 + seedOff) - 0.5);
          b += 0.3 * sstep(0.84, 1.0, r);
          if (marksAt) b += (under ? 0.06 : 0.22) * marksAt(u, v);
          if (lump > 0) b -= 0.2 * lump * sstep(0.78, 0.92, Noise.n2(u * 26 + 40, v * 26 + 9));
          const col = crepeColor(b);
          const lit = 1 + 0.09 * (-(u + v) * 0.5) + (rnd() - 0.5) * 0.05;
          d[idx] = clamp(col[0] * lit, 0, 255);
          d[idx + 1] = clamp(col[1] * lit, 0, 255);
          d[idx + 2] = clamp(col[2] * lit, 0, 255);
          d[idx + 3] = Math.round(a * 255);
        }
        py++;
        if (performance.now() - t0 > budgetMs) break;
      }
      if (py >= S && !job.done) { g.putImageData(img, 0, 0); job.done = true; }
      return job.done;
    }
  };
  return job;
}
function genCrepeTexture(size, sampleH, marksAt, opts = {}) {
  const j = crepeTexJob(size, sampleH, marksAt, opts);
  j.step(1e9);
  return j.canvas;
}
